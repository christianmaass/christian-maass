name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Reine Inhalts- und Doku-PRs ohne Lighthouse (spart ~2 min); nach dem Merge läuft es auf main trotzdem.
    # Pfade = Mini-Pfade und „ohne Deploy“ aus .claude/skills/stack/SKILL.md
    paths-ignore:
      - 'src/content/**'
      - 'docs/**'
      - 'public/og/**'
      - 'public/essays/**'
      - 'specs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
