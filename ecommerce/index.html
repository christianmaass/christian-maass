<style>
  :root{
    --font-family-base:'Montserrat',Arial,sans-serif; --font-family-display:'Newsreader','Source Serif Pro',Georgia,serif;
    --weight-light:300; --weight-medium:500; --weight-bold:700;
    --container-max-width:1200px; --container-padding-x:1.5rem;
    --color-bg:#f6f1e8; --color-bg-elevated:#fcf8ee;
    --color-text:#1a1a1a; --color-text-strong:#000; --color-text-muted:#5a5a5a;
    --color-border-subtle:rgba(0,0,0,.08); --color-border-strong:rgba(0,0,0,.16);
    --color-accent:#315a78; --color-on-accent:#fff; --radius-md:1rem;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--font-family-base);font-weight:var(--weight-light);color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;display:none;overflow:auto}
  .slide.active{display:block}
  /* creme frame decoration */
  .slide.hero,.slide.stmt,.slide.ag{background:var(--color-bg)}
  .slide.hero::after,.slide.stmt::after,.slide.ag::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 50% at 82% 8%,rgba(49,90,120,.10),transparent 70%),radial-gradient(50% 45% at 8% 96%,rgba(49,90,120,.07),transparent 70%)}
  .fadeit{animation:cin .6s cubic-bezier(.16,1,.3,1) both}
  @keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* HERO */
  .hero{display:flex!important;align-items:center;justify-content:center;text-align:center;padding:clamp(3rem,12vh,9rem) 1.5rem}
  .hero.slide:not(.active){display:none!important}
  .hero__content{position:relative;z-index:1;max-width:60ch}
  .hero__eyebrow{font-family:'Space Mono',monospace;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:var(--color-accent);margin-bottom:1.4rem}
  .hero__title{font-family:var(--font-family-display);font-weight:var(--weight-medium);font-size:clamp(2.5rem,6vw,5rem);letter-spacing:-.02em;line-height:1.05;color:var(--color-text-strong)}
  .hero__title .accent{color:var(--color-accent);font-style:italic}
  .hero__subtitle{margin:1.6rem auto 0;max-width:46ch;font-size:clamp(1.1rem,2.2vw,1.5rem);line-height:1.6}
  .hero__author{margin-top:2.4rem;font-weight:var(--weight-medium);font-size:clamp(1rem,2vw,1.3rem);text-transform:uppercase;letter-spacing:.16em;color:var(--color-accent)}

  /* STATEMENT */
  .stmt__inner{position:relative;z-index:1;max-width:var(--container-max-width);margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(3rem,8vh,5rem) var(--container-padding-x)}
  .kicker{font-family:'Space Mono',monospace;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent);margin-bottom:1.2rem}
  .stitle{font-family:var(--font-family-display);font-weight:var(--weight-medium);font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.1;letter-spacing:-.01em;color:var(--color-text-strong);max-width:20ch}
  .stitle .accent{color:var(--color-accent);font-style:italic}
  .ssub{margin:1.5rem 0 0;font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.6;max-width:56ch}
  .demo-pill{margin-top:2.2rem;display:inline-flex;align-items:center;gap:.6rem;align-self:flex-start;font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.06em;color:var(--color-accent);border:1px solid var(--color-border-strong);border-radius:999px;padding:.6rem 1.1rem;background:var(--color-bg-elevated)}
  .demo-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent)}

  /* AGENDA */
  .ag__inner{position:relative;z-index:1;max-width:var(--container-max-width);margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(3rem,8vh,5rem) var(--container-padding-x)}
  .ag .stitle{margin-bottom:1.8rem}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media(max-width:760px){.agrid{grid-template-columns:1fr}}
  .acard{display:flex;gap:.9rem;align-items:flex-start;background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:1rem 1.15rem}
  .anum{flex:0 0 auto;width:30px;height:30px;border-radius:999px;background:var(--color-accent);color:var(--color-on-accent);font-family:'Space Mono',monospace;font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .atxt .at{font-weight:var(--weight-medium);font-size:1rem;color:var(--color-text-strong)}
  .atxt .ad{font-size:.86rem;color:var(--color-text-muted);line-height:1.45;margin-top:.15rem}

  /* DEMO iframe */
  .slide.demo{background:#0f1119}
  #demoFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0f1119}
  #demoFrame.show{display:block}

  /* brand + byline (nur auf Rahmenfolien) */
  .brand-word{position:fixed;top:clamp(1.6rem,4vh,2.6rem);right:var(--container-padding-x);z-index:40;font-family:var(--font-family-display);font-weight:var(--weight-medium);font-size:1.05rem;color:var(--color-text-strong);opacity:.8;pointer-events:none}
  .byline{position:fixed;bottom:1.15rem;left:var(--container-padding-x);z-index:9998;font-size:.8rem;color:var(--color-text-muted);pointer-events:none;transition:opacity .3s}
  body:not(.on-demo) .byline{opacity:0}
  .frameonly{transition:opacity .3s; pointer-events:none}
  body.on-demo .frameonly{opacity:0}

  /* nav */
  .navbar{position:fixed;bottom:1.05rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:.7rem;
    background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.14);border-radius:999px;padding:.35rem .5rem;backdrop-filter:blur(8px);box-shadow:0 8px 24px -12px rgba(0,0,0,.4)}
  body.on-demo .navbar{background:rgba(18,22,30,.66);border-color:rgba(255,255,255,.22)}
  .navbtn{width:40px;height:40px;border-radius:999px;border:1px solid rgba(0,0,0,.2);background:transparent;color:rgba(0,0,0,.7);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  body.on-demo .navbtn{border-color:rgba(255,255,255,.28);color:#e6e8f0}
  .navbtn:hover{border-color:var(--color-accent);color:var(--color-accent)}
  body.on-demo .navbtn:hover{border-color:#fff;color:#fff}
  .navbtn:disabled{opacity:.3;cursor:default}
  .navcount{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.08em;color:var(--color-text-muted);min-width:56px;text-align:center}
  body.on-demo .navcount{color:rgba(255,255,255,.6)}

  @media(prefers-reduced-motion:reduce){.fadeit{animation:none}}
</style>
</head>

  var DEMOS={"d1":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Wie Empfehlungen entstehen — interaktiver Explainer</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --paper:#f6f2ea; --paper-2:#ece5d8;\n    --amber:#e2a13a; --amber-deep:#bd7d1c;\n    --teal:#2f9e97;\n    --ink-soft:#5a5a5a; --ink-softer:#8a8a8a;\n    --paper-ink:#23242c; --paper-soft:#6a6357;\n    --line-ink:rgba(0,0,0,.10);\n    --line-paper:rgba(20,20,30,.13);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{\n    margin:0; background:var(--ink); color:#1a1a1a;\n    font-family:'Montserrat',Arial,sans-serif;\n    font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;\n  }\n  .wrap{max-width:940px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber)}\n\n  /* ---------- HERO ---------- */\n  .hero{position:relative; padding:120px 0 72px; overflow:hidden}\n  .hero::before{\n    content:\"\"; position:absolute; inset:-40% 20% auto -20%; height:520px;\n    background:radial-gradient(closest-side, rgba(226,161,58,.20), transparent 70%);\n    filter:blur(10px); z-index:0;\n  }\n  .hero::after{\n    content:\"\"; position:absolute; inset:20% -20% auto 40%; height:420px;\n    background:radial-gradient(closest-side, rgba(47,158,151,.16), transparent 70%);\n    z-index:0;\n  }\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(44px,7.5vw,82px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--amber)}\n  .thesis{font-size:clamp(19px,2.4vw,23px); color:#333333; max-width:640px; margin:26px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n  .scroll-hint{margin-top:44px; font-size:13px; color:var(--ink-soft); font-family:\"Space Mono\",monospace; letter-spacing:.08em}\n\n  /* ---------- SECTION SHELL ---------- */\n  .stage{padding:70px 0; border-top:1px solid var(--line-ink)}\n  .stage-label{display:flex; align-items:baseline; gap:16px; margin-bottom:8px}\n  .stage-num{font-family:\"Space Mono\",monospace; font-size:13px; color:var(--ink-softer); letter-spacing:.1em}\n  .stage h2{font-size:clamp(30px,4.3vw,44px); margin:6px 0 0}\n  .stage-sub{color:#5a5a5a; max-width:600px; margin:16px 0 0}\n  .stage-sub .a{color:var(--amber); font-weight:600}\n  .stage-sub .t{color:var(--teal); font-weight:600}\n\n  /* ---------- PAPER STAGE (interactive area) ---------- */\n  .paper{\n    background:var(--paper); color:var(--paper-ink);\n    border-radius:18px; padding:30px; margin-top:30px; box-shadow:var(--shadow);\n  }\n  .paper .hint{font-size:14px; color:var(--paper-soft); margin:0 0 20px}\n  .paper .hint em{font-style:normal; font-weight:600; color:var(--amber-deep)}\n\n  /* ---------- STAGE 1: CF MATRIX ---------- */\n  .mx-wrap{overflow-x:auto; margin:0 -6px}\n  table.mx{border-collapse:separate; border-spacing:0; width:100%; min-width:520px; font-size:13.5px}\n  table.mx th, table.mx td{padding:8px 6px; text-align:center}\n  .col-h{font-size:11px; color:var(--paper-soft); font-weight:600; vertical-align:bottom}\n  .col-h .em{font-size:20px; display:block; margin-bottom:3px}\n  .row-h{text-align:left; white-space:nowrap; padding-right:14px}\n  .row-h .nm{font-weight:600}\n  .row-h .role{font-size:11px; color:var(--paper-soft); margin-left:2px}\n  .sim{display:inline-block; margin-left:8px; font-family:\"Space Mono\",monospace; font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; vertical-align:middle}\n  .sim.a{background:rgba(226,161,58,.16); color:var(--amber-deep)}\n  .sim.t{background:rgba(47,158,151,.16); color:#1f776f}\n  .sim.z{background:rgba(20,20,30,.06); color:var(--paper-soft)}\n  .val{display:inline-flex; align-items:center; justify-content:center; width:31px; height:31px; border-radius:8px; font-family:\"Space Mono\",monospace; font-weight:700; font-size:13px; color:#1a1a1a}\n  .val.empty{background:transparent!important; color:#b9b1a1}\n  .you-row td{padding-top:12px}\n  .you-cell{display:inline-flex; gap:4px; padding:7px 5px; border-radius:9px; cursor:pointer; transition:background .15s}\n  .you-cell:hover{background:rgba(226,161,58,.14)}\n  .pip{width:10px; height:10px; border-radius:50%; border:1.6px solid var(--amber-deep); box-sizing:border-box}\n  .pip.on{background:var(--amber-deep)}\n  .sep td{border-top:2px dashed var(--line-paper); height:2px; padding:0}\n  .you-h{color:var(--amber-deep)!important}\n\n  /* recos panel */\n  .recos{margin-top:26px; padding:22px; border:1px solid var(--line-paper); border-radius:14px; background:var(--paper-2)}\n  .recos-h{font-family:'Newsreader',serif; font-weight:600; font-size:18px; margin:0 0 16px}\n  .reco{margin-bottom:15px}\n  .reco:last-child{margin-bottom:0}\n  .reco-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}\n  .reco-nm{font-weight:600; font-size:15px}\n  .reco-sc{font-family:\"Space Mono\",monospace; font-weight:700; color:var(--amber-deep); font-size:13px}\n  .bar{height:8px; border-radius:6px; background:rgba(20,20,30,.08); margin:7px 0 5px; overflow:hidden}\n  .bar-f{height:100%; background:linear-gradient(90deg,var(--amber),var(--amber-deep)); border-radius:6px; transition:width .4s cubic-bezier(.2,.7,.    x:.30,y:.16},\n    {e:\"🎛️\",l:\"Effektpedal\",   x:.40,y:.52},\n    {e:\"🔁\",l:\"Looper\",        x:.47,y:.58},\n    {e:\"🎚\",l:\"Mischpult\",     x:.60,y:.55},\n    {e:\"🎹\",l:\"Analog-Synth\",  x:.66,y:.86},\n    {e:\"⌨️\",l:\"MIDI-Keyboard\", x:.77,y:.80},\n    {e:\"💿\",l:\"DJ-Controller\", x:.82,y:.92},\n    {e:\"🔌\",l:\"Interface\",     x:.84,y:.58},\n    {e:\"🎤\",l:\"Studio-Mikro\",  x:.90,y:.38},\n    {e:\"🎧\",l:\"Kopfhörer\",     x:.95,y:.52}\n  ];\n  const personas=[{x:.19,y:.24,c:\"a\"},{x:.24,y:.30,c:\"a\"},{x:.80,y:.82,c:\"t\"},{x:.86,y:.74,c:\"t\"},{x:.52,y:.52,c:\"t\"}];\n  let du={x:.34,y:.44};\n  const W=160,H=100;\n  const Sx=x=>10+x*140;\n  const Sy=y=>H-(8+y*84);\n  const svg=document.getElementById(\"lsSvg\");\n  function nearest(){return items.map((it,i)=>({i,d:Math.hypot(it.x-du.x,it.y-du.y)})).sort((a,b)=>a.d-b.d);}\n  function render(){\n    const near=nearest(),topSet=new Set(near.slice(0,3).map(o=>o.i));\n    let h=\"\";\n    h+=`<line x1=\"10\" y1=\"92\" x2=\"150\" y2=\"92\" stroke=\"rgba(20,20,30,.20)\" stroke-width=\".4\"/>`;\n    h+=`<line x1=\"10\" y1=\"8\" x2=\"10\" y2=\"92\" stroke=\"rgba(20,20,30,.20)\" stroke-width=\".4\"/>`;\n    h+=`<text class=\"axis-label\" x=\"80\" y=\"99\" text-anchor=\"middle\">Bühne  ←→  Studio</text>`;\n    h+=`<text class=\"axis-label\" x=\"3.4\" y=\"50\" text-anchor=\"middle\" transform=\"rotate(-90 3.4 50)\">organisch ←→ elektronisch</text>`;\n    near.slice(0,3).forEach(o=>{const it=items[o.i];h+=`<line class=\"link-line\" x1=\"${Sx(du.x)}\" y1=\"${Sy(du.y)}\" x2=\"${Sx(it.x)}\" y2=\"${Sy(it.y)}\"/>`;});\n    personas.forEach(p=>{const c=p.c===\"a\"?\"#315a78\":\"#2f9e97\";h+=`<circle class=\"persona-dot\" cx=\"${Sx(p.x)}\" cy=\"${Sy(p.y)}\" r=\"1.5\" fill=\"${c}\"/>`;});\n    items.forEach((it,i)=>{const top=topSet.has(i);\n      h+=`<circle class=\"item-dot\" cx=\"${Sx(it.x)}\" cy=\"${Sy(it.y)}\" r=\"${top?2.6:1.9}\" fill=\"${top?\"#315a78\":\"#c9c0ae\"}\" stroke=\"${top?\"#264a64\":\"none\"}\" stroke-width=\".5\"/>`;\n      h+=`<text class=\"item-lab\" x=\"${Sx(it.x)}\" y=\"${Sy(it.y)-3.0}\" text-anchor=\"middle\" opacity=\"${top?1:.72}\">${it.e} ${it.l}</text>`;\n    });\n    h+=`<circle class=\"you-dot\" id=\"youDot\" cx=\"${Sx(du.x)}\" cy=\"${Sy(du.y)}\" r=\"3.2\" fill=\"#e2a13a\" stroke=\"#bd7d1c\" stroke-width=\"1.1\"/>`;\n    h+=`<text x=\"${Sx(du.x)}\" y=\"${Sy(du.y)+1.2}\" text-anchor=\"middle\" font-size=\"2.8\" font-weight=\"700\" fill=\"#23242c\" pointer-events=\"none\">Du</text>`;\n    svg.innerHTML=h;\n    document.getElementById(\"lsOut\").innerHTML=near.slice(0,4).map((o,idx)=>{const it=items[o.i];const match=Math.max(0,Math.round((1-o.d/1.1)*100));\n      return `<span class=\"ls-pill ${idx<3?\"top\":\"\"}\"><span class=\"e\">${it.e}</span><span class=\"nm\">${it.l}</span><span class=\"d\">${match}%</span></span>`;}).join(\"\");\n    bindDrag();\n  }\n  function pt(ev){const r=svg.getBoundingClientRect();const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;\n    const vx=(cx/r.width)*W, vy=(cy/r.height)*H;\n    let nx=(vx-10)/140, ny=(92-vy)/84;\n    du.x=Math.min(1,Math.max(0,nx));du.y=Math.min(1,Math.max(0,ny));render();}\n  let dragging=false;\n  function bindDrag(){const yd=document.getElementById(\"youDot\");yd.addEventListener(\"pointerdown\",e=>{dragging=true;yd.setPointerCapture(e.pointerId);e.preventDefault();});}\n  svg.addEventListener(\"pointermove\",e=>{if(dragging)pt(e);});\n  window.addEventListener(\"pointerup\",()=>{dragging=false;});\n  svg.addEventListener(\"pointerdown\",e=>{if(e.target.id!==\"youDot\"){pt(e);dragging=true;}});\n  render();\n})();\n\n/* ============ Scroll reveal ============ */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObserver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver((ent)=>{ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}});},{threshold:.12});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d2":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Der Schild vor dem Shop — wie Thomann sich am Edge schützt</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --allow:#34d399; --allow-d:#1f9d73;\n    --challenge:#e2a13a;\n    --block:#ff5c4d; --block-d:#d63a2c;\n    --edge:#f6821f; --edge-soft:rgba(246,130,31,.16);\n    --good:#38bdf8;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.10);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--ink); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1040px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--edge)}\n\n  /* HERO */\n  .hero{position:relative; padding:110px 0 60px; overflow:hidden}\n  .hero::before{content:\"\"; position:absolute; inset:-30% 30% auto -15%; height:460px;\n    background:radial-gradient(closest-side, rgba(246,130,31,.20), transparent 70%); z-index:0}\n  .hero::after{content:\"\"; position:absolute; inset:10% -15% auto 45%; height:420px;\n    background:radial-gradient(closest-side, rgba(52,211,153,.14), transparent 70%); z-index:0}\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(42px,7vw,78px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--edge)}\n  .thesis{font-size:clamp(18px,2.3vw,22px); color:#333333; max-width:680px; margin:24px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n  .scroll-hint{margin-top:38px; font-size:13px; color:var(--tx-soft); font-family:\"Space Mono\",monospace; letter-spacing:.06em}\n\n  /* STAGE */\n  .stage{padding:56px 0; border-top:1px solid var(--line)}\n  .stage-label{display:flex; align-items:baseline; gap:16px; margin-bottom:6px}\n  .stage-num{font-family:\"Space Mono\",monospace; font-size:13px; color:var(--tx-softer); letter-spacing:.1em}\n  .stage h2{font-size:clamp(28px,4vw,42px); margin:6px 0 0}\n  .stage-sub{color:#5a5a5a; max-width:660px; margin:14px 0 0}\n\n  /* CONTROLS */\n  .controls{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end; margin:26px 0 18px}\n  .ctl-group .lab{font-family:\"Space Mono\",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--tx-soft); margin-bottom:9px}\n  .btns{display:flex; flex-wrap:wrap; gap:9px}\n  .atk{font-family:'Montserrat',sans-serif; font-size:13.5px; font-weight:600; color:#315a78; background:rgba(49,90,120,.10);\n    border:1.5px solid rgba(49,90,120,.35); border-radius:9px; padding:9px 14px; cursor:pointer; transition:all .15s}\n  .atk:hover{background:rgba(49,90,120,.18); border-color:#315a78}\n  .atk:active,.atk.all:active{background:rgba(49,90,120,.26); transform:translateY(1px)}\n  .slider-wrap{display:flex; align-items:center; gap:12px; min-width:220px}\n  .slider{-webkit-appearance:none; appearance:none; width:150px; height:6px; border-radius:4px;\n    background:linear-gradient(90deg,var(--ink-3),var(--allow)); outline:none}\n  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--ink); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.5)}\n  .slider::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--ink); cursor:pointer}\n  .slider-val{font-family:\"Space Mono\",monospace; font-size:13px; color:var(--tx-soft); min-width:74px}\n  .toggle-hint{font-size:12.5px; color:var(--tx-softer); margin:2px 0 0; font-style:italic}\n\n  /* FLOW */\n  .flow-scroll{overflow-x:auto; margin:0 -6px; padding:0 6px}\n  .flow{position:relative; height:470px; min-width:860px; border-radius:16px; box-shadow:var(--shadow);\n    background:linear-gradient(180deg,#fcf8ee,#f0e9db); border:1px solid var(--line); overflow:hidden}\n  #flowCanvas{position:absolute; inset:0; z-index:3; pointer-events:none}\n  .zone{position:absolute; top:0; bottom:0; z-index:2; display:flex; flex-direction:column; justify-content:center; padding:18px 14px}\n  .zone.src{left:0; width:14%; border-right:1px dashed var(--line)}\n  .zone.org{right:0; width:15%; border-left:1px dashed var(--line); align-items:center; text-align:center}\n  .zone-title{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-soft); margin-bottom:12px; line-height:1.4}\n  .leg{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--tx-soft); margin-bottom:8px}\n  .leg .d{width:9px; height:9px; border-radius:50%; flex:0 0 auto}\n\n  .gate{position:absolute; top:14px; bottom:14px; z-index:2; width:2px; transform:translateX(-50%);\n    display:flex; flex-direction:column; align-items:center; cursor:pointer}\n  .gate .bar{position:absolute; top:44px; bottom:56px; width:4px; border-radius:4px;\n    background:linear-gradient(180deg,var(--edge),rgba(246,130,31,.25)); box-shadow:0 0 0 rgba(246,130,31,0); transition:box-shadow .2s, opacity .2s, background .2s}\n  .gate .halo{position:absolute; top:44px; bottom:56px; width:40px; left:50%; transform:translateX(-50%); border-radius:20px;\n    background:radial-gradient(ellipse at center, var(--edge-soft), transparent 70%); opacity:0; transition:opacity .12s}\n  .gate.flash .halo{opacity:1}\n  .gate.flash .bar{box-shadow:0 0 22px 3px rgba(246,130,31,.6)}\n  .gate .g-name{position:absolute; top:6px; width:150px; left:50%; transform:translateX(-50%); text-align:center;\n    font-size:12.5px; font-weight:600; color:#1a1a1a}\n  .gate .g-sub{position:absolute; top:24px; width:160px; left:50%; transform:translateX(-50%); text-align:center;\n    font-size:10px; color:var(--tx-soft); line-height:1.3}\n  .gate .g-count{position:absolute; bottom:20px; width:120px; left:50%; transform:translateX(-50%); text-align:center;\n    font-family:\"Space Mono\",monospace; font-size:11px; font-weight:700; color:var(--block)}\n  .gate .g-count small{display:block; font-weight:400; color:var(--tx-softer); font-size:9px; letter-spacing:.08em}\n  .gate.off .bar{background:repeating-linear-gradient(180deg,var(--block) 0 6px,transparent 6px 12px); opacity:.55; box-shadow:none}\n  .gate.off .g-name{color:var(--block)}\n  .gate .g-badge{position:absolute; bottom:2px; left:50%; transform:translateX(-50%); font-family:\"Space Mono\",monospace;\n    font-size:9px; letter-spacing:.14em; color:var(--block); opacity:0}\n  .gate.off .g-badge{opacity:1}\n  .gate.cache .bar{background:linear-gradient(180deg,var(--allow),rgba(52,211,153,.25))}\n  .gate.cache.flash .bar{box-shadow:0 0 22px 3px rgba(52,211,153,.55)}\n  .gate.cache .halo{background:radial-gradient(ellipse at center, rgba(52,211,153,.16), transparent 70%)}\n  .gate.cache .g-count{color:var(--allow)}\n\n  /* origin */\n  .org .server{width:52px; height:66px; border-radius:8px; background:linear-gradient(180deg,var(--ink-3),var(--ink-2));\n    border:1px solid var(--line); position:relative; margin-bottom:14px; transition:box-shadow .2s, border-color .2s}\n  .org .server::before,.org .server::after{content:\"\"; position:absolute; left:8px; right:8px; height:3px; border-radius:2px; background:var(--allow); opacity:.75}\n  .org .server::before{top:12px} .org .server::after{top:22px}\n  .org .server .led{position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--allow); box-shadow:0 0 6px var(--allow)}\n  .org.alarm .server{border-color:var(--block); box-shadow:0 0 26px -2px rgba(255,92,77,.7); animation:shake .32s}\n  .org.alarm .server .led{background:var(--block); box-shadow:0 0 8px var(--block)}\n  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}\n  .gauge{width:100%; max-width:96px}\n  .gauge .gl{font-family:\"Space Mono\",monospace; font-size:9px; letter-spacing:.1em; color:var(--tx-soft); text-transform:uppercase; margin-bottom:5px}\n  .gauge .track{height:8px; border-radius:5px; background:rgba(0,0,0,.08); overflow:hidden}\n  .gauge .fill{height:100%; width:8%; border-radius:5px; background:var(--allow); transition:width .25s, background .25s}\n  .org-stats{margin-top:14px; font-family:\"Space Mono\",monospace; font-size:10px; color:var(--tx-soft); line-height:1.7}\n  .org-stats b{color:#1a1a1a; font-size:13px}\n  .org-stats .leaked b{color:var(--block)}\n\n  /* summary strip */\n  .strip{display:flex; flex-wrap:wrap; gap:14px; margin-top:20px}\n  .stat{flex:1; min-width:150px; padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--ink-2)}\n  .stat .k{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-soft)}\n  .stat .v{font-family:'Newsreader',serif; font-size:30px; margin-top:6px; line-height:1}\n  .stat.blocked .v{color:var(--block)} .stat.edge .v{color:var(--allow)} .stat.origin .v{color:var(--edge)}\n\n  /* reference cards */\n  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:34px}\n  @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}\n  @media(max-width:540px){.cards{grid-template-columns:1fr}}\n  .card{padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--ink-2); transition:transform .2s,border-color .2s}\n  .card:hover{transform:translateY(-3px); border-color:rgba(246,130,31,.4)}\n  .card .step{font-family:\"Space Mono\",monospace; font-size:11px; letter-spacing:.12em; color:var(--edge)}\n  .card h3{font-size:19px; margin:8px 0 8px; color:#1a1a1a}\n  .card p{font-size:14px; color:#5a5a5a; margin:0 0 10px; line-height:1.55}\n  .card .th{font-size:12.5px; color:var(--tx-soft); padding-top:10px; border-top:1px solid var(--line)}\n  .card .th b{color:var(--allow)}\n\n  footer{padding:56px 0 90px; border-top:1px solid var(--line); color:var(--tx-softer); font-size:13.5px}\n  footer b{color:#5a5a5a}\n\n  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none} *{scroll-behavior:auto!important}}\n  :focus-visible{outline:2px solid var(--edge); outline-offset:2px}\n\n    /* ===== christianmaass Standard-Typografie ===== */\n    body{background:#f6f1e8; color:#1a1a1a}\n    .eyebrow,.kicker,.stage-num{color:#315a78 !important}\n    h1,h2,h3{color:#1a1a1a}\n    .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); line-height:1.15; letter-spacing:-.01em}\n    .stage-sub,.thesis{font-size:1.05rem; line-height:1.6; color:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n  \n</style>\n</head>\n<body>\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">Security als Asset</div>\n    <h2>Der Schild vor dem <span style=\"color:#315a78;font-style:italic\">Shop</span></h2>\n    <p class=\"stage-sub\">Kein Besucher spricht direkt mit unseren Servern — jede Anfrage läuft zuerst durch den Cloudflare-Edge. Löse Angriffswellen aus und schalte Schutzschichten ab.</p>\n\n    <div class=\"controls\">\n      <div class=\"ctl-group\">\n        <div class=\"lab\">Angriff auslösen</div>\n        <div class=\"btns\">\n          <button class=\"atk\" data-atk=\"ddos\">DDoS-Flut</button>\n          <button class=\"atk\" data-atk=\"scraper\">Preis-Scraper</button>\n          <button class=\"atk\" data-atk=\"sqli\">SQL-Injection</button>\n          <button class=\"atk\" data-atk=\"brute\">Login-Brute-Force</button>\n          <button class=\"atk all\" data-atk=\"all\">🔥 Alles gleichzeitig</button>\n        </div>\n      </div>\n      <div class=\"ctl-group\">\n        <div class=\"lab\">Grundlast (Besucher)</div>\n        <div class=\"slider-wrap\">\n          <input type=\"range\" min=\"1\" max=\"16\" value=\"6\" class=\"slider\" id=\"rateSlider\">\n          <span class=\"slider-val mono\" id=\"rateVal\">normal</span>\n        </div>\n      </div>\n    </div>\n    <p class=\"toggle-hint\">Tipp: Klick auf eine Schutzschicht, um sie <strong>abzuschalten</strong> — dann sieh zu, was das Origin trifft.</p>\n\n    <div class=\"flow-scroll\">\n      <div class=\"flow\" id=\"flow\">\n        <div class=\"zone src\">\n          <div class=\"zone-title\">Offenes<br>Internet</div>\n          <div class=\"leg\"><span class=\"d\" style=\"background:var(--allow)\"></span>Besucher</div>\n          <div class=\"leg\"><span class=\"d\" style=\"background:var(--good)\"></span>Googlebot</div>\n          <div class=\"leg\"><span class=\"d\" style=\"background:var(--block)\"></span>Angriff</div>\n          <div class=\"leg\"><span class=\"d\" style=\"background:var(--challenge)\"></span>verdächtig</div>\n        </div>\n        <!-- gates injected by JS -->\n        <div class=\"zone org\" id=\"origin\">\n          <div class=\"zone-title\">Thomann<br>Origin</div>\n          <div class=\"server\"><span class=\"led\"></span></div>\n          <div class=\"gauge\">\n            <div class=\"gl\">Origin-Last</div>\n            <div class=\"track\"><div class=\"fill\" id=\"loadFill\"></div></div>\n          </div>\n          <div class=\"org-stats\">\n            <div>erreicht: <b id=\"oReached\">0</b></div>\n            <div class=\"leaked\">durchgerutscht: <b id=\"oLeaked\">0</b></div>\n          </div>\n        </div>\n        <canvas id=\"flowCanvas\"></canvas>\n      </div>\n    </div>\n\n    <div class=\"strip\">\n      <div class=\"stat blocked\"><div class=\"k\">Angriffe geblockt</div><div class=\"v\" id=\"sBlocked\">0</div></div>\n      <div class=\"stat edge\"><div class=\"k\">Vom Edge bedient</div><div class=\"v\" id=\"sEdge\">0</div></div>\n      <div class=\"stat origin\"><div class=\"k\">Sauber ans Origin</div><div class=\"v\" id=\"sOrigin\">0</div></div>\n      <div class=\"stat\"><div class=\"k\">Origin-Entlastung</div><div class=\"v mono\" id=\"sOffload\" style=\"font-family:'Space Mono',monospace;font-size:26px;color:var(--allow)\">—</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <div class=\"stage-label\"><span class=\"stage-num\">Die Schichten</span></div>\n    <h2>Was jede Stufe leistet</h2>\n    <p class=\"stage-sub\">Jede Schicht entfernt eine ganze Klasse von Bedrohungen — günstig und ohne dass das Backend je davon erfährt. „Defense in Depth\": Fällt eine Schicht aus, öffnet sich genau ihre Bedrohungsklasse wieder (genau das zeigt der Abschalt-Klick oben).</p>\n    <div class=\"cards\">\n      <div class=\"card\">\n        <div class=\"step\">Stufe 00</div><h3>Anycast-Edge</h3>\n        <p>Die Anfrage landet automatisch am nächstgelegenen Rechenzentrum im globalen Netz — nicht in Treppendorf. Nähe schafft Tempo und verteilt Last, bevor überhaupt gefiltert wird.</p>\n        <div class=\"th\"><b>Für Thomann:</b> ein Käufer aus Madrid trifft Madrid, nicht Franken.</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"step\">Stufe 01</div><h3>DDoS-Schutz</h3>\n        <p>Auf Netzwerkebene (L3/L4) werden Volumen-Fluten absorbiert — Millionen sinnloser Pakete, die das Origin sonst in die Knie zwängen.</p>\n        <div class=\"th\"><b>Stoppt:</b> Überlast-Angriffe, bevor sie Bandbreite kosten.</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"step\">Stufe 02</div><h3>WAF</h3>\n        <p>Die Web Application Firewall liest jede HTTP-Anfrage (L7) und blockt bekannte Angriffsmuster nach OWASP-Regeln, bevor sie die Applikation erreichen.</p>\n        <div class=\"th\"><b>Stoppt:</b> SQL-Injection, XSS und Exploit-Versuche gegen die Checkout-Schicht.</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"step\">Stufe 03</div><h3>Rate Limiting</h3>\n        <p>Drosselt zu viele Anfragen aus derselben Quelle in kurzer Zeit — der Unterschied zwischen einem Kunden und einer Maschine, die Passwörter durchprobiert.</p>\n        <div class=\"th\"><b>Stoppt:</b> Brute-Force am Login, API-Abuse, Checkout-Spam.</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"step\">Stufe 04</div><h3>Bot Management</h3>\n        <p>Bewertet, wie „menschlich\" eine Anfrage ist. Gute Bots wie Googlebot dürfen durch, aggressive Scraper werden geblockt, Grenzfälle bekommen eine Challenge.</p>\n        <div class=\"th\"><b>Für Thomann:</b> hält Preis-Scraper von Wettbewerbern draußen, ohne SEO zu verlieren.</div>\n      </div>\n      <div class=\"card\">\n        <div class=\"step\">Stufe 05</div><h3>Edge-Cache (CDN)</h3>\n        <p>Kein Filter, sondern Entlastung: Produktbilder, Kategorieseiten und Statisches werden direkt vom Rand geliefert. Nur dynamische Anfragen — Login, Warenkorb, Checkout — laufen weiter ans Origin.</p>\n        <div class=\"th\"><b>Effekt:</b> das Backend sieht nur einen Bruchteil des echten Traffics.</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <p>Ein Prinzip, viele Schichten: <b>Das Origin steht nie im offenen Netz.</b> Jede Stufe ist billig hinzuzufügen und entfernt eine Klasse von Angriffen; der Cache sorgt dafür, dass die meiste legitime Last den Kern gar nicht erst berührt. Dieselbe Logik wie beim Empfehlungs-Explainer — die entscheidende Arbeit passiert am Rand, bevor das Kernsystem angefasst wird.</p>\n  </div>\n</footer>\n\n<script>\n(function(){\n  /* ---------- config ---------- */\n  const GATES=[\n    {key:\"ddos\",  name:\"DDoS-Schutz\",   sub:\"L3/L4 · absorbiert Volumen-Fluten\", f:.26, cache:false},\n    {key:\"waf\",   name:\"WAF\",           sub:\"L7 · SQL-Injection, XSS, Exploits\", f:.41, cache:false},\n    {key:\"rate\",  name:\"Rate Limiting\", sub:\"drosselt Brute-Force & API-Abuse\",  f:.55, cache:false},\n    {key:\"bot\",   name:\"Bot Management\",sub:\"trennt Mensch, guter Bot & Scraper\",f:.69, cache:false},\n    {key:\"cache\", name:\"Edge-Cache\",    sub:\"liefert Statisches vom Rand\",       f:.83, cache:true}\n  ];\n  const SRC_F=.085, ORG_F=.925;\n  // which gate index handles which threat\n  const HANDLER={ddos:0, sqli:1, brute:2, scraper:3, suspicious:3};\n  const COL={\n    visitor:\"#34d399\", googlebot:\"#38bdf8\", ddos:\"#ff5c4d\", sqli:\"#ff7a52\",\n    brute:\"#ff5c4d\", scraper:\"#ff6b6b\", suspicious:\"#e2a13a\"\n  };\n\n  const flow=document.getElementById(\"flow\");\n  const canvas=document.getElementById(\"flowCanvas\");\n  const ctx=canvas.getContext(\"2d\");\n  const reduce=window.matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\n\n  /* ---------- build gate DOM ---------- */\n  const gateEls=[];\n  GATES.forEach((g,i)=>{\n    const el=document.createElement(\"div\");\n    el.className=\"gate\"+(g.cache?\" cache\":\"\");\n    el.style.left=(g.f*100)+\"%\";\n    el.innerHTML=`<div class=\"halo\"></div><div class=\"bar\"></div>\n      <div class=\"g-name\">${g.name}</div><div class=\"g-sub\">${g.sub}</div>\n      <div class=\"g-count\"><span class=\"n\">0</span><small>${g.cache?\"vom Edge\":\"geblockt\"}</small></div>\n      <div class=\"g-badge\">AUS</div>`;\n    el.addEventListener(\"click\",()=>{ g.on=!g.on; el.classList.toggle(\"off\",!g.on); });\n    flow.insertBefore(el, canvas);\n    g.on=true; g.blocked=0; g.flashT=0;\n    g.el=el; g.countEl=el.querySelector(\".n\");\n    gateEls.push(el);\n  });\n\n  /* ---------- canvas sizing ---------- */\n  let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);\n  function resize(){\n    const r=flow.getBoundingClientRect();\n    W=r.width; H=r.height;\n    canvas.width=W*dpr; canvas.height=H*dpr;\n    canvas.style.width=W+\"px\"; canvas.style.height=H+\"px\";\n    ctx.setTransform(dpr,0,0,dpr,0,0);\n  }\n  new ResizeObserver(resize).observe(flow);\n  resize();\n  const yTop=()=>58, yBot=()=>H-64;\n\n  /* ---------- state ---------- */\n  const packets=[]; const bursts=[];\n  let baseRate=6, baseAcc=0;\n  const waves=[]; // {type,left,interval,timer}\n  let stats={blocked:0, edge:0, origin:0, leaked:0};\n  let originLoad=0, alarmT=0;\n\n  /* ---------- spawning ---------- */\n  function spawn(type){\n    if(packets.length>150) return;\n    let handler=(type in HANDLER)?HANDLER[type]:-1;\n    let legit=(type===\"visitor\"||type===\"googlebot\");\n    packets.push({\n      x:SRC_F, prevX:SRC_F,\n      y:yTop()+Math.random()*(yBot()-yTop()),\n      vx:(reduce?0.10:0.17)+Math.random()*0.05,\n      type, color:COL[type]||\"#fff\",\n      handler, legit,\n      cacheable: type===\"visitor\" ? Math.random()<0.72 : (type===\"googlebot\" && Math.random()<0.4),\n      state:\"flow\", alpha:1, r:type===\"ddos\"?2.2:3\n    });\n  }\n  function spawnBaseline(){\n    const roll=Math.random();\n    if(roll<0.07) spawn(\"suspicious\");\n    else if(roll<0.16) spawn(\"googlebot\");\n    else spawn(\"visitor\");\n  }\n  function launch(type){\n    const map={\n      ddos:{type:\"ddos\",count:55,interval:0.028},\n      scraper:{type:\"scraper\",count:26,interval:0.07},\n      sqli:{type:\"sqli\",count:16,interval:0.11},\n      brute:{type:\"brute\",count:22,interval:0.085}\n    };\n    if(type===\"all\"){ [\"ddos\",\"scraper\",\"sqli\",\"brute\"].forEach(t=>launch(t)); return; }\n    const m=map[type]; if(!m) return;\n    waves.push({type:m.type,left:m.count,interval:m.interval,timer:0});\n  }\n  document.querySelectorAll(\".atk\").forEach(b=>b.addEventListener(\"click\",()=>launch(b.dataset.atk)));\n  const rateSlider=document.getElementById(\"rateSlider\"), rateVal=document.getElementById(\"rateVal\");\n  function rateLabel(v){ return v<=3?\"ruhig\":v<=7?\"normal\":v<=11?\"Stoßzeit\":\"Peak (Cyber Monday)\"; }\n  rateSlider.addEventListener(\"input\",()=>{ baseRate=+rateSlider.value; rateVal.textContent=rateLabel(baseRate); });\n  rateVal.textContent=rateLabel(baseRate);\n\n  /* ---------- outcomes ---------- */\n  function block(p,gi){\n    p.state=\"blocked\"; p.vx=0;\n    const g=GATES[gi]; g.blocked++; g.flashT=1; stats.blocked++;\n    bursts.push({x:g.f, y:p.y, r:3, max:20, a:1, color:g.cache?\"#34d399\":\"#ff5c4d\"});\n  }\n  function serveEdge(p){\n    p.state=\"served\"; p.vx=0;\n    GATES[4].blocked++; GATES[4].flashT=1; stats.edge++;\n    bursts.push({x:GATES[4].f, y:p.y, r:2, max:14, a:1, color:\"#34d399\"});\n  }\n  function reachOrigin(p){\n    p.state=\"origin\"; p.vx=0;\n    if(p.legit){ stats.origin++; originLoad=Math.min(1,originLoad+0.015); }\n    else { stats.leaked++; originLoad=Math.min(1,originLoad+(p.type===\"ddos\"?0.05:0.11)); alarmT=1; }\n    bursts.push({x:ORG_F, y:p.y, r:2, max:12, a:1, color:p.legit?\"#34d399\":\"#ff5c4d r:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n    .hero::before,.hero::after{display:none !important}\n    .stage{border-top:none !important}\n  \n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">Proprietäre Daten</div>\n    <h1>Ein Login, <em>ein Profil</em></h1>\n  </div>\n</header>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <p class=\"stage-sub\">Ein Thomann-Login (SSO) verbindet alle Property-Seiten.</p>\n\n    <div class=\"topo\"><svg id=\"topoSvg\" viewBox=\"0 0 200 128\" aria-label=\"Portfolio-Topologie mit zentralem SSO-Login\"></svg></div>\n\n    <div class=\"grid\" style=\"position:relative\">\n      <!-- LEFT -->\n      <div class=\"panel\" style=\"position:relative\">\n        <div class=\"p-h panel-h\">Portfolio-Seiten · Kundenaktionen</div>\n        <div id=\"sites\"></div>\n\n        <div class=\"profile\">\n          <div class=\"p-h panel-h\" style=\"margin-top:22px\">Gemeinsames Profil (SSO)</div>\n          <div class=\"id-row\">\n            <div class=\"avatar\">TM</div>\n            <div class=\"id-meta\"><div class=\"n\">Eingeloggter Kunde</div><div class=\"s\" id=\"idHash\">id: th_a1f9…</div></div>\n            <div class=\"id-badge\">SSO aktiv</div>\n          </div>\n          <div id=\"affBars\"></div>\n          <div class=\"prof-foot\">\n            <span>Signale: <span id=\"sigCount\" style=\"color:var(--sig)\">0</span></span>\n            <span id=\"detected\"></span>\n            <button class=\"reset\" id=\"reset\">↺ zurücksetzen</button>\n          </div>\n        </div>\n        <div class=\"toast\" id=\"toast\"></div>\n      </div>\n\n      <!-- RIGHT -->\n      <div class=\"panel\" style=\"padding:0; background:transparent; border:none\">\n        <div class=\"th\">\n          <div class=\"th-bar\">\n            <div class=\"th-dots\"><i></i><i></i><i></i></div>\n            <div class=\"th-url\">🔒 thomann.de</div>\n            <div class=\"th-toggle\">\n              <button id=\"tAnon\">anonym</button><button id=\"tPers\" class=\"on\">eingeloggt</button>\n            </div>\n          </div>\n          <div class=\"th-body\" id=\"thBody\"></div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<script>\n(function(){\n  /* ---- editierbare Portfolio-Definition ---- */\n  const SITES=[\n    {dm:\"bonedo.de\", kind:\"Test-Magazin\", acts:[\n      {l:\"Test: Audio-Interface\", w:{Recording:3}},\n      {l:\"Test: Stagepiano\", w:{Tasten:3}},\n      {l:\"Workshop: Recording für Gitarristen\", w:{Gitarre:2,Recording:2}}\n    ]},\n    {dm:\"piano.de\", kind:\"Tasten-Community\", acts:[\n      {l:\"Digitalpianos verglichen\", w:{Tasten:3}},\n      {l:\"Ratgeber: erstes Keyboard\", w:{Tasten:2}}\n    ]},\n    {dm:\"recording.de\", kind:\"Studio & Bühne\", acts:[\n      {l:\"Thread: Homestudio-Setup\", w:{Recording:3}},\n      {l:\"Mikrofon-Kaufberatung\", w:{Recording:2}},\n      {l:\"PA-Beschallung Guide\", w:{Live:3}}\n    ]},\n    {dm:\"gitarrebass.de\", kind:\"Gitarren-Portal\", acts:[\n      {l:\"Amp-Vergleich gelesen\", w:{Gitarre:3}},\n      {l:\"Effektpedale-Guide\", w:{Gitarre:2}}\n    ]},\n    {dm:\"dj-lab.de\", kind:\"DJ-Blog\", acts:[\n      {l:\"Controller-Test\", w:{DJ:3}},\n      {l:\"Sync vs. Beatmatching\", w:{DJ:2}}\n    ]}\n  ];\n  const DIMS=[\n    {k:\"Recording\", label:\"Recording & Studio\", c:\"var(--cRecording)\"},\n    {k:\"Tasten\",    label:\"Tasten & Piano\",     c:\"var(--cTasten)\"},\n    {k:\"Gitarre\",   label:\"Gitarre & Bass\",     c:\"var(--cGitarre)\"},\n    {k:\"DJ\",        label:\"DJ & Electronic\",    c:\"var(--cDJ)\"},\n    {k:\"Live\",      label:\"Live & PA\",          c:\"var(--cLive)\"}\n  ];\n  const CATS={\n    Recording:[{n:\"Audient iD4 MkII\",p:\"Audio-Interface\"},{n:\"Shure SM7B\",p:\"Studio-Mikrofon\"},{n:\"KRK Rokit 5 G4\",p:\"Studiomonitor\"}],\n    Tasten:[{n:\"Roland FP-30X\",p:\"Digitalpiano\"},{n:\"Nord Stage 4\",p:\"Stagepiano\"},{n:\"Arturia KeyLab 61\",p:\"MIDI-Keyboard\"}],\n    Gitarre:[{n:\"Fender Player Strat\",p:\"E-Gitarre\"},{n:\"Boss Katana-100\",p:\"Gitarren-Amp\"},{n:\"Ibanez Tube Screamer\",p:\"Effektpedal\"}],\n    DJ:[{n:\"Pioneer DDJ-FLX4\",p:\"DJ-Controller\"},{n:\"Denon SC6000\",p:\"Media-Player\"}],\n    Live:[{n:\"the box CL 108\",p:\"PA-Lautsprecher\"},{n:\"Shure SM58\",p:\"Gesangsmikrofon\"},{n:\"LD Systems MAUI 5\",p:\"Säulen-PA\"}]\n  };\n  const BEST=[{n:\"Harley Benton ST-20\",p:\"Einsteiger-Gitarre\"},{n:\"the t.bone SC 420\",p:\"USB-Mikrofon\"},{n:\"Millenium MPS-150\",p:\"E-Drum-Set\"},{n:\"Stagg Music Stand\",p:\"Notenständer\"}];\n  const dimColor={Recording:\"var(--cRecording)\",Tasten:\"var(--cTasten)\",Gitarre:\"var(--cGitarre)\",DJ:\"var(--cDJ)\",Live:\"var(--cLive)\"};\n\n  /* ---- state ---- */\n  let aff={Recording:0,Tasten:0,Gitarre:0,DJ:0,Live:0};\n  let contrib={}; // dim -> {site, label, w}\n  let sigCount=0;\n  let mode=\"pers\"; // pers | anon\n\n  /* ---- topology svg ---- */\n  (function buildTopo(){\n    const svg=document.getElementById(\"topoSvg\");\n    const cx=100, cy=64, R=42;\n    let h=\"\";\n    const nodePos=[];\n    SITES.forEach((s,i)=>{\n      const ang=Math.PI*(0.12 + (i/(SITES.length-1))*0.76); // top arc\n      const x=cx - Math.cos(ang)*R*1.55, y=cy - Math.sin(ang)*R*0.86 - 8;\n      nodePos.push({x,y});\n      // edge\n      h+=`<path id=\"edge${i}\" d=\"M ${x} ${y} L ${cx} ${cy}\" stroke=\"rgba(49,90,120,.28)\" stroke-width=\".5\" fill=\"none\"/>`;\n    });\n    // pulses along edges (site -> hub)\n    SITES.forEach((s,i)=>{\n      const p=nodePos[i], dur=(2.4+Math.random()*1.6).toFixed(2);\n      h+=`<circle r=\"1\" fill=\"#34d399\"><animateMotion dur=\"${dur}s\" repeatCount=\"indefinite\" path=\"M ${p.x} ${p.y} L ${cx} ${cy}\"/></circle>`;\n    });\n    // hub\n    h+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"16\" fill=\"rgba(49,90,120,.14)\" stroke=\"#315a78\" stroke-width=\".7\"/>`;\n    h+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"8.5\" fill=\"url(#hg)\"/>`;\n    h+=`<text class=\"hub-lab\" x=\"${cx}\" y=\"${cy+1}\" text-anchor=\"middle\">Login</text>`;\n    h+=`<text class=\"hub-sub\" x=\"${cx}\" y=\"${cy+21}\" text-anchor=\"middle\">THOMANN-ID · SSO</text>`;\n    // nodes\n    SITES.forEach((s,i)=>{\n      const p=nodePos[i];\n      h+=`<circle id=\"tn${i}\" class=\"tnode\" cx=\"${p.x}\" cy=\"${p.y}\" r=\"4.4\" fill=\"#fcf8ee\" stroke=\"rgba(49,90,120,.5)\" stroke-width=\".6\" style=\"transition:all .25s\"/>`;\n      const anchor = p.x<cx-6?\"end\":(p.x>cx+6?\"start\":\"middle\");\n      const tx = anchor===\"end\"?p.x-6:(anchor===\"start\"?p.x+6:p.x);\n      h+=`<text class=\"tnode-lab\" x=\"${tx}\" y=\"${p.y-1}\" text-anchor=\"${anchor}\">${s.dm}</text>`;\n      h+=`<text class=\"tnode-sub\" x=\"${tx}\" y=\"${p.y+4}\" text-anchor=\"${anchor}\">${s.kind}</text>`;\n    });\n    const defs=`<defs><radialGradient id=\"hg\"><stop offset=\"0\" stop-color=\"#5a8aa8\"/><stop offset=\"1\" stop-color=\"#264a64\"/></radialGradient></defs>`;\n    svg.innerHTML=defs+h;\n  })();\n  function flashNode(i){ const n=document.getElementById(\"tn\"+i); if(!n)return; n.setAttribute(\"r\",\"6.4\"); n.setAttribute(\"fill\",\"#315a78\"); setTimeout(()=>{n.setAttribute(\"r\",\"4.4\"); n.setAttribute(\"fill\",\"#fcf8ee\");},480); }\n\n  /* ---- build site cards ---- */\n  (function(){\n    const box=document.getElementById(\"sites\");\n    box.innerHTML=SITES.map((s,si)=>`\n      <div class=\"site\" id=\"site${si}\">\n        <div class=\"site-top\"><span class=\"site-name\"><span class=\"dm\">${s.dm}</span></span><span class=\"site-kind\">${s.kind}</span></div>\n        <div class=\"acts\">${s.acts.map((a,ai)=>`<button class=\"act\" data-s=\"${si}\" data-a=\"${ai}\">${a.l}<span class=\"cnt\">×<b>0</b></span></button>`).join(\"\")}</div>\n      </div>`).join(\"\");\n    box.querySelectorAll(\".act\").forEach(b=>b.addEventListener(\"click\",()=>doAction(+b.dataset.s,+b.dataset.a,b)));\n  })();\n\n  function doAction(si,ai,btn){\n    const s=SITES[si], a=s.acts[ai];\n    for(const dim in a.w){\n      aff[dim]+=a.w[dim];\n      if(!contrib[dim] || a.w[dim]>=contrib[dim].w){ contrib[dim]={site:s.dm,label:a.l,w:a.w[dim]}; }\n    }\n    sigCount++;\n    // action hit count\n    btn.classList.add(\"hit\"); const b=btn.querySelector(\".cnt b\"); b.textContent=(+b.textContent+1);\n    document.getElementById(\"site\"+si).classList.add(\"pulse\"); setTimeout(()=>document.getElementById(\"site\"+si).classList.remove(\"pulse\"),400);\n    flashNode(si);\n    // toast (strongest dim of this action)\n    let td=Object.keys(a.w).sort((x,y)=>a.w[y]-a.w[x])[0];\n    toast(`+ ${td} · ${s.dm}`);\n    render();\n  }\n  function toast(txt){\n    const box=document.getElementById(\"toast\");\n    const el=document.createElement(\"div\"); el.className=\"t\"; el.textContent=txt; box.appendChild(el);\n    setTimeout(()=>el.remove(),1600);\n  }\n\n  /* ---- render profile + thomann ---- */\n  function render(){\n    const max=Math.max(1,...Object.values(aff));\n    document.getElementById(\"affBars\").innerHTML=DIMS.map(d=>{\n      const v=aff[d.k], pct=(v/max)*100;\n      return `<div class=\"aff\"><div class=\"aff-top\"><span class=\"aff-nm\">${d.label}</span><span class=\"aff-val\">${v}</span></div>\n        <div class=\"aff-bar\"><div class=\"aff-fill\" style=\"width:${pct}%;background:${d.c}\"></div></div></div>`;\n    }).join(\"\");\n    document.getElementById(\"sigCount\").textContent=sigCount;\n    // detected profile\n    const ranked=DIMS.map(d=>({d,v:aff[d.k]})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);\n    document.getElementById(\"detected\").innerHTML = ranked.length ? `· Profil: <span style=\"color:${ranked[0].d.c}\">${ranked[0].d.label.split(\" \")[0]}</span>` : \"\";\n    renderThomann(ranked);\n  }\n\n  function renderThomann(ranked){\n    const body=document.getElementById(\"thBody\");\n    if(mode===\"anon\"){\n      body.innerHTML=`\n        <div class=\"th-hero anon\"><div class=\"lab\">Startseite · anonym</div>\n          <div class=\"cat\">Bestseller diese Woche</div>\n          <div class=\"sub\">Keine Historie erkannt — generische Empfehlungen für alle.</div></div>\n        <div class=\"tiles\">${BEST.map(p=>`<div class=\"tile anon\">\n          <div class=\"pn\">${p.n}</div><div class=\"pt\">${p.p}</div>\n          <div class=\"why\">generischer Bestseller · kein Bezug zum Kunden</div></div>`).join(\"\")}</div>`;\n      return;\n    }\n    if(!ranked.length){\n      body.innerHTML=`<div class=\"th-empty\">Noch keine Signale.<br>Klicke links Aktionen im Portfolio an — die Startseite personalisiert sich dann sofort.</div>`;\n      return;\n    }\n    const top=ranked[0].d;\n    // build up to 4 tiles across top dims\n    const tiles=[]; \n    for(const o of ranked){ for(const p of CATS[o.d.k]){ if(tiles.length<4){ tiles.push({p,dim:o.d}); } } }\n    body.innerHTML=`\n      <div class=\"th-hero\"><div class=\"lab\">Für dich · ${top.label}</div>\n        <div class=\"cat\">${top.label}</div>\n        <div class=\"sub\">Dein stärkstes Interesse aus dem Portfolio — direkt oben.</div>\n        <div class=\"instant\">⚡ personalisiert ab dem ersten Aufruf · 0 ms Cold-Start</div></div>\n      <div class=\"tiles\">${tiles.map(t=>{\n        const c=contrib[t.dim.k];\n        const why = c? `weil du auf <b>${c.site}</b> „${c.label}\" angesehen hast` : `passt zu deinem Profil`;\n        return `<div class=\"tile\"><div class=\"pn\"><span class=\"cat-dot\" style=\"background:${t.dim.c}\"></span>${t.p.n}</div>\n          <div class=\"pt\">${t.p.p}</div><div class=\"why\">${why}</div></div>`;\n      }).join(\"\")}</div>`;\n  }\n\n  /* ---- controls ---- */\n  document.getElementById(\"tAnon\").addEventListener(\"click\",()=>{mode=\"anon\"; document.getElementById(\"tAnon\").classList.add(\"on\"); document.getElementById(\"tPers\").classList.remove(\"on\"); render();});\n  document.getElementById(\"tPers\").addEventListener(\"click\",()=>{mode=\"pers\"; document.getElementById(\"tPers\").classList.add(\"on\"); document.getElementById(\"tAnon\").classList.remove(\"on\"); render();});\n  document.getElementById(\"reset\").addEventListener(\"click\",()=>{\n    aff={Recording:0,Tasten:0,Gitarre:0,DJ:0,Live:0}; contrib={}; sigCount=0;\n    document.querySelectorAll(\".act\").forEach(b=>{b.classList.remove(\"hit\"); b.querySelector(\".cnt b\").textContent=\"0\";});\n    render();\n  });\n\n  render();\n})();\n\n/* scroll reveal */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObserver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}}),{threshold:.1});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d4":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Vom Tippen zum Dirigieren — die Evolution des KI-Engineerings</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --human:#f0864f; --human-d:#d1653a; --human-soft:rgba(240,134,79,.16);\n    --agent:#315a78; --agent-d:#264a64; --agent-soft:rgba(49,90,120,.16);\n    --spec:#e8c15a; --ok:#34d399;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.10);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--ink); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1080px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--agent)}\n\n  .hero{position:relative; padding:110px 0 54px; overflow:hidden}\n  .hero::before{content:\"\"; position:absolute; inset:-30% 25% auto -15%; height:460px; background:radial-gradient(closest-side,rgba(49,90,120,.20),transparent 70%); z-index:0}\n  .hero::after{content:\"\"; position:absolute; inset:12% -15% auto 46%; height:420px; background:radial-gradient(closest-side,rgba(240,134,79,.15),transparent 70%); z-index:0}\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(42px,7vw,78px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--agent)}\n  .thesis{font-size:clamp(18px,2.3vw,22px); color:#333333; max-width:720px; margin:24px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n  .thesis .h{color:var(--human); font-weight:600} .thesis .a{color:var(--agent); font-weight:600}\n  .scroll-hint{margin-top:36px; font-size:13px; color:var(--tx-soft); font-family:\"Space Mono\",monospace; letter-spacing:.06em}\n\n  .stage{padding:54px 0; border-top:1px solid var(--line)}\n stify-content:space-between; margin-bottom:6px}\n  .scene-title{font-family:'Newsreader',serif; font-weight:600; font-size:20px}\n  .unit{font-family:\"Space Mono\",monospace; font-size:11px; color:var(--spec); border:1px solid rgba(232,193,90,.4); border-radius:20px; padding:4px 10px; white-space:nowrap}\n  .scene-svg{flex:1; display:flex; align-items:center; justify-content:center}\n  .scene-svg svg{width:100%; height:auto; max-height:260px}\n  .sc-fade{animation:fade .45s ease}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .lab{font-family:\"Space Mono\",monospace; font-size:6px; fill:var(--tx-soft)}\n  .lab-h{fill:var(--human)} .lab-a{fill:var(--agent)} .lab-s{fill:var(--spec)}\n  .nlab{font-family:'Montserrat',sans-serif; font-size:6.5px; font-weight:600; fill:#1a1a1a}\n\n  .detail{display:flex; flex-direction:column; gap:16px}\n  .card{background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:18px}\n  .card .h{font-family:\"Space Mono\",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--tx-soft); margin:0 0 10px}\n  .role{display:flex; gap:11px; margin-bottom:12px}\n  .role:last-child{margin-bottom:0}\n  .role .chip{flex:0 0 auto; width:52px; text-align:center; font-family:\"Space Mono\",monospace; font-size:10px; font-weight:700; padding:5px 0; border-radius:7px; height:fit-content}\n  .role.h .chip{background:var(--human-soft); color:var(--human); border:1px solid rgba(240,134,79,.35)}\n  .role.a .chip{background:var(--agent-soft); color:var(--agent); border:1px solid rgba(49,90,120,.35)}\n  .role .txt{font-size:13.5px; color:#333333; line-height:1.5}\n\n  /* split bars */\n  .splits .sp{margin-bottom:13px}\n  .splits .sp:last-child{margin-bottom:0}\n  .sp-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px}\n  .sp-nm{font-weight:600} .sp-val{font-family:\"Space Mono\",monospace; color:var(--tx-soft); font-size:11px}\n  .sp-bar{height:11px; border-radius:6px; overflow:hidden; display:flex; background:var(--ink-3)}\n  .sp-h{background:var(--human); transition:width .5s cubic-bezier(.2,.7,.2,1)}\n  .sp-a{background:var(--agent); transition:width .5s cubic-bezier(.2,.7,.2,1)}\n  .split-leg{display:flex; gap:16px; margin-top:12px; font-size:11px; color:var(--tx-soft); font-family:\"Space Mono\",monospace}\n  .split-leg i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle}\n\n  /* altitude */\n  .alt{display:flex; align-items:flex-end; gap:14px}\n  .ladder{display:flex; flex-direction:column-reverse; gap:6px; flex:1}\n  .rung{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); font-size:12px; color:var(--tx-soft); transition:all .3s}\n  .rung .rn{font-family:\"Space Mono\",monospace; font-size:10px; color:var(--tx-softer)}\n  .rung.on{background:var(--human-soft); border-color:rgba(240,134,79,.5); color:#1a1a1a}\n  .rung.on .rn{color:var(--human)}\n\n  .tr{display:grid; grid-template-columns:auto 1fr; gap:10px 12px; font-size:13.5px}\n  .tr .k{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-softer); padding-top:2px}\n  .tr .v{color:#333333; line-height:1.45}\n  .tr .v.risk{color:#f0a58a}\n\n  /* comparison grid */\n  .cmp-scroll{overflow-x:auto; margin:30px -6px 0; padding:0 6px}\n  .cmp{min-width:760px; border-collapse:separate; border-spacing:0; width:100%}\n  .cmp th,.cmp td{padding:14px 15px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); font-size:13.5px}\n  .cmp thead th{font-family:'Newsreader',serif; font-weight:600; font-size:16px; color:#1a1a1a; border-bottom:1px solid var(--line)}\n  .cmp thead th .tg{display:block; font-family:\"Space Mono\",monospace; font-size:10px; color:var(--agent); font-weight:400; margin-top:3px; letter-spacing:.06em}\n  .cmp tbody th{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-soft); font-weight:400; white-space:nowrap}\n  .cmp td{color:#5a5a5a; line-height:1.45}\n  .cmp .risk{color:#e79f86}\n\n  footer{padding:54px 0 90px; border-top:1px solid var(--line); color:var(--tx-softer); font-size:13.5px}\n  footer b{color:#5a5a5a}\n  footer .kick{font-family:'Newsreader',serif; font-size:20px; color:#1a1a1a; font-weight:500; margin:0 0 12px}\n\n  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none} .sc-fade{animation:none} *{scroll-behavior:auto!important}}\n  :focus-visible{outline:2px solid var(--agent); outline-offset:2px}\n\n    /* ===== christianmaass Standard-Typografie ===== */\n    body{background:#f6f1e8; color:#1a1a1a}\n    .eyebrow,.kicker,.stage-num{color:#315a78 !important}\n    h1,h2,h3{color:#1a1a1a}\n    .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); line-height:1.15; letter-spacing:-.01em}\n    .stage-sub,.thesis{font-size:1.05rem; line-height:1.6; color:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n    .hero::before,.hero::after{display:none !important}\n    .stage{border-top:none !important}\n  \n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">The Agentic Organization</div>\n    <h1>Vom Tippen zum <em>Dirigieren</em></h1>\n  </div>\n</header>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n\n    <div class=\"stepper\" id=\"stepper\"></div>\n    <div class=\"play-row\">\n      <button class=\"play\" id=\"play\">▶ Evolution abspielen</button>\n      <span class=\"legend-hint\"><span class=\"h\">■</span> Mensch &nbsp; <span class=\"a\">■</span> Agent</span>\n    </div>\n\n    <div class=\"main\">\n      <div class=\"scene-box\">\n        <div class=\"scene-top\">\n          <span class=\"scene-title\" id=\"scTitle\"></span>\n          <span class=\"unit\" id=\"scUnit\"></span>\n        </div>\n        <div class=\"scene-svg\" id=\"scSvg\"></div>\n      </div>\n\n      <div class=\"detail\">\n        <div class=\"card\">\n          <div class=\"h\">Wer macht was</div>\n          <div class=\"role h\"><span class=\"chip\">MENSCH</span><span class=\"txt\" id=\"rHuman\"></span></div>\n          <div class=\"role a\"><span class=\"chip\">AGENT</span><span class=\"txt\" id=\"rAgent\"></span></div>\n        </div>\n\n        <div class=\"card splits\">\n          <div class=\"h\">Kontrolle · Mensch vs. Agent</div>\n          <div id=\"splitBars\"></div>\n          <div class=\"split-leg\"><span><i style=\"background:var(--human)\"></i>Mensch</span><span><i style=\"background:var(--agent)\"></i>Agent</span></div>\n        </div>\n\n        <div class=\"card\">\n          <div class=\"h\">Ebene des Menschen</div>\n          <div class=\"ladder\" id=\"ladder\"></div>\n        </div>\n\n        <div class=\"card\">\n          <div class=\"tr\">\n            <span class=\"k\">Stärke</span><span class=\"v\" id=\"tTrait\"></span>\n            <span class=\"k\">Risiko</span><span class=\"v risk\" id=\"tRisk\"></span>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <p class=\"kick\">Der Flaschenhals wandert — vom Tippen zum Spezifizieren zum Integrieren.</p>\n    <p>Jede Stufe verschiebt die knappe Ressource. Früher war es die Tippgeschwindigkeit, dann die Prompt-Iteration, heute die Qualität der <b>Spezifikation</b> und die <b>Aufsicht über parallel arbeitende Agenten</b>. Der Code wird zum Wegwerf-Artefakt; was bleibt, sind Absicht, Verträge und Review. Verantwortung bleibt beim Menschen — nur eben eine Ebene höher.</p>\n  </div>\n</footer>\n\n<script>\n(function(){\n  const reduce=window.matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\n  const STAGES=[\n    { name:\"Copilot\", tag:\"~2021\",\n      unit:\"Zeile / Funktion\",\n      human:\"schreibt den Code und trifft jede Entscheidung selbst.\",\n      agent:\"vervollständigt im Editor — Autocomplete auf Steroiden, ohne eigenen Plan.\",\n      split:{ \"Schreiben\":[70,30], \"Entscheiden\":[95,5], \"Prüfen\":[100,0] },\n      altitude:0, trait:\"Beschleunigt das Tippen, nicht das Denken.\",\n      risk:\"Der Mensch bleibt Flaschenhals für jede einzelne Zeile.\" },\n    { name:\"Vibe Coding\", tag:\"~2023\",\n      unit:\"Feature / Komponente\",\n      human:\"beschreibt in Prompts, was er will, und beurteilt „nach Gefühl“ — Schleife um Schleife.\",\n      agent:\"generiert ganze Blöcke aus natürlicher Sprache und wird iterativ nachjustiert.\",\n      split:{ \"Schreiben\":[20,80], \"Entscheiden\":[75,25], \"Prüfen\":[85,15] },\n      altitude:1, trait:\"Schnell zum ersten Lauf, geführt vom Augenschein.\",\n      risk:\"Ohne Spezifikation: Drift, kaum reproduzierbar, skaliert schlecht.\" },\n    { name:\"Agentic Engineering\", tag:\"2024–25\",\n      unit:\"EPIC / ganze Anwendung\",\n      human:\"schreibt zuerst die Spezifikation — Absicht, Verträge, Abnahmekriterien — und prüft das Ergebnis dagegen.\",\n      agent:\"plant aus der Spec, baut autonom ein ganzes EPIC und prüft sich selbst gegen die Spec.\",\n      split:{ \"Schreiben\":[5,95], \"Entscheiden\":[55,45], \"Prüfen\":[60,40] },\n      altitude:2, trait:\"Die Spec ist die Quelle der Wahrheit — Ausführung wird reproduzierbar.\",\n      risk:\"Steht und fällt mit der Qualität der Spezifikation.\" },\n    { name:\"Agent-Orchestrierung\", tag:\"heute\",\n      unit:\"System / mehrere EPICs parallel\",\n      human:\"setzt Ziele und Leitplanken und prüft auf Systemebene statt einzelne Tasks.\",\n      agent:\"ein Orchestrator zerlegt die Spec und steuert spezialisierte Subagenten (Frontend, Backend, Tests, Review), die parallel arbeiten und zusammengeführt werden.\",\n      split:{ \"Schreiben\":[2,98], \"Entscheiden\":[35,65], \"Prüfen\":[45,55] },\n      altitude:3, trait:\"Parallelität und Spezialisierung — der Mensch skaliert über Delegation.\",\n      risk:\"Koordination, Fehlerfortpflanzung und Nachvollziehbarkeit werden zentral.\" }\n  ];\n  const RUNGS=[\"Tastatur — Zeichen für Zeichen\",\"Prompt — beschreiben & nachbessern\",\"Spezifikation — Absicht statt Code\",\"Ziele & Leitplanken — dirigieren\"];\n\n  let cur=0, playing=false, timer=null;\n\n  /* ---------- SVG scenes (durchgehende Produktoberfläche) ---------- */\n  const C={h:\"#f0864f\",hS:\"rgba(240,134,79,.16)\",a:\"#315a78\",aS:\"rgba(49,90,120,.16)\",spec:\"#e8c15a\",specS:\"rgba(232,193,90,.14)\",ok:\"#34d399\",okS:\"rgba(52,211,153,.13)\",win:\"#fcf8ee\",winTop:\"#efe7d4\",line:\"rgba(0,0,0,.14)\",faint:\"#cbc3b2\",dot:\"#a89f8c\",txt:\"#5a5a5a\"};\n  function pulse(x1,y1,x2,y2,color,dur){ if(reduce) return \"\"; return `<circle r=\"1.5\" fill=\"${color}\"><animateMotion dur=\"${dur}s\" repeatCount=\"indefinite\" path=\"M ${x1} ${y1} L ${x2} ${y2}\"/></circle>`; }\n  function human(x,y,label){ return `<circle cx=\"${x}\" cy=\"${y}\" r=\"9\" fill=\"${C.hS}\" stroke=\"${C.h}\" stroke-width=\"1.2\"/><circle cx=\"${x}\" cy=\"${y-2.5}\" r=\"3\" fill=\"${C.h}\"/><path d=\"M ${x-5} ${y+6} q 5 -6 10 0\" fill=\"${C.h}\"/>${label?`<text class=\"lab\" x=\"${x}\" y=\"${y+18}\" text-anchor=\"middle\" fill=\"${C.h}\">${label}</text>`:\"\"}`; }\n  function agent(x,y,r,label,sub){ let s=`<rect x=\"${x-r}\" y=\"${y-r}\" width=\"${r*2}\" height=\"${r*2}\" rx=\"4\" fill=\"${C.aS}\" stroke=\"${C.a}\" stroke-width=\"1.1\"/><circle cx=\"${x-r*0.4}\" cy=\"${y-r*0.2}\" r=\"1.4\" fill=\"${C.a}\"/><circle cx=\"${x+r*0.4}\" cy=\"${y-r*0.2}\" r=\"1.4\" fill=\"${C.a}\"/><path d=\"M ${x-r*0.5} ${y+r*0.35} q ${r*0.5} ${r*0.4} ${r} 0\" stroke=\"${C.a}\" stroke-width=\"1\" fill=\"none\"/>`;\n    if(label) s+=`<text class=\"nlab\" x=\"${x}\" y=\"${y+r+8}\" text-anchor=\"middle\" fill=\"${C.a}\">${label}</text>`;\n    if(sub) s+=`<text class=\"lab\" x=\"${x}\" y=\"${y+r+(label?15:8)}\" text-anchor=\"middle\">${sub}</text>`;\n    return s; }\n  function win(x,y,w,h,stroke){ return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"6\" fill=\"${C.win}\" stroke=\"${stroke||C.line}\" stroke-width=\"${stroke?1.3:1}\"/><path d=\"M ${x} ${y+10} h ${w}\" stroke=\"${C.line}\" stroke-width=\".6\"/><circle cx=\"${x+7}\" cy=\"${y+5}\" r=\"1.3\" fill=\"${C.dot}\"/><circle cx=\"${x+12}\" cy=\"${y+5}\" r=\"1.3\" fill=\"${C.dot}\"/><circle cx=\"${x+17}\" cy=\"${y+5}\" r=\"1.3\" fill=\"${C.dot}\"/>`; }\n  function row(x,y,w){ return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"3.2\" rx=\"1.6\" fill=\"${C.faint}\"/>`; }\n  function grow(text){ const w=text.length*3.4+12; return `<g><rect x=\"150\" y=\"160\" width=\"${w}\" height=\"11\" rx=\"5.5\" fill=\"${C.okS}\" stroke=\"${C.ok}\" stroke-width=\".7\"/><circle cx=\"158\" cy=\"165.5\" r=\"2\" fill=\"${C.ok}\"/><text x=\"164\" y=\"168.6\" font-family=\"Space Mono, monospace\" font-size=\"5.4\" font-weight=\"700\" fill=\"${C.ok}\">${text}</text></g>`; }\n  function cap(text){ return `<text class=\"lab\" x=\"6\" y=\"167\" font-size=\"6\">${text}</text>`; }\n\n  function scene(i){\n    if(i===0){ // Copilot — EIN Element auf der Oberfläche\n      return `<svg viewBox=\"0 0 300 176\">\n        ${human(32,86,\"Mensch\")}\n        ${win(148,30,120,116)}\n        ${row(158,46,84)}${row(158,54,98)}${row(158,62,62)}\n        ${row(158,86,98)}${row(158,94,72)}${row(158,102,90)}\n        <rect x=\"158\" y=\"118\" width=\"46\" height=\"16\" rx=\"4\" fill=\"${C.okS}\" stroke=\"${C.ok}\" stroke-width=\"1.2\"/>\n        <rect x=\"165\" y=\"124\" width=\"32\" height=\"4\" rx=\"2\" fill=\"${C.ok}\"/>\n        <path d=\"M 44 92 C 90 126, 128 130, 156 126\" stroke=\"${C.h}\" stroke-width=\".8\" stroke-dasharray=\"3 3\" fill=\"none\" opacity=\".7\"/>\n        ${agent(256,140,12,\"\",\"KI schlägt vor\")}\n        <path d=\"M 245 136 L 208 128\" stroke=\"${C.a}\" stroke-width=\".8\" stroke-dasharray=\"3 3\" fill=\"none\" opacity=\".6\"/>\n        ${pulse(245,136,208,128,C.a,1.5)}\n        ${cap(\"Mensch baut ein einzelnes Element · KI schlägt die nächste Zeile vor\")}\n        ${grow(\"baut: 1 Element\")}\n      </svg>`;\n    }\n    if(i===1){ // Vibe — EINE Komponente, iterative Schleife\n      return `<svg viewBox=\"0 0 300 176\">\n        ${human(40,52,\"ansehen\")}\n        ${agent(40,116,12,\"\",\"generiert\")}\n        ${win(150,30,118,116)}\n        ${row(160,46,80)}${row(160,54,96)}\n        <rect x=\"160\" y=\"66\" width=\"98\" height=\"52\" rx=\"5\" fill=\"${C.okS}\" stroke=\"${C.ok}\" stroke-width=\"1.2\"/>\n        <rect x=\"167\" y=\"74\" width=\"56\" height=\"4\" rx=\"2\" fill=\"${C.ok}\"/>\n        <rect x=\"167\" y=\"83\" width=\"82\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(52,211,153,.5)\"/>\n        <rect x=\"167\" y=\"91\" width=\"70\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(52,211,153,.5)\"/>\n        <rect x=\"167\" y=\"104\" width=\"34\" height=\"9\" rx=\"3\" fill=\"${C.ok}\"/>\n        ${row(160,126,90)}\n        <path d=\"M 52 112 C 90 118, 120 116, 156 106\" stroke=\"${C.a}\" stroke-width=\".8\" fill=\"none\" opacity=\".65\"/>\n        ${pulse(52,112,150,104,C.a,1.5)}\n        <path d=\"M 156 74 C 118 60, 88 56, 50 54\" stroke=\"${C.h}\" stroke-width=\".8\" fill=\"none\" opacity=\".65\"/>\n        <path d=\"M 40 62 L 40 104\" stroke=\"${C.h}\" stroke-width=\".8\" stroke-dasharray=\"3 3\" fill=\"none\" opacity=\".55\"/>\n        <text class=\"lab\" x=\"40\" y=\"86\" text-anchor=\"middle\" fill=\"${C.h}\">↻ anpassen</text>\n        ${cap(\"Eine Komponente · in einer Prompt-Schleife „nach Gefühl“ gebaut\")}\n        ${grow(\"baut: 1 Komponente\")}\n      </svg>`;\n    }\n    if(i===2){ // Agentic — EINE ganze App aus der Spec\n      return `<svg viewBox=\"0 0 300 176\">\n        ${human(26,58,\"\")}\n        <text class=\"lab\" x=\"26\" y=\"80\" text-anchor=\"middle\" fill=\"${C.h}\">schreibt Spec</text>\n        <rect x=\"52\" y=\"38\" width=\"42\" height=\"56\" rx=\"5\" fill=\"${C.win}\" stroke=\"${C.spec}\" stroke-width=\"1.2\"/>\n        <rect x=\"59\" y=\"47\" width=\"28\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(232,193,90,.7)\"/>\n        <rect x=\"59\" y=\"54\" width=\"28\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(232,193,90,.5)\"/>\n        <rect x=\"59\" y=\"61\" width=\"20\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(232,193,90,.5)\"/>\n        <rect x=\"59\" y=\"72\" width=\"28\" height=\"3.4\" rx=\"1.7\" fill=\"rgba(232,193,90,.35)\"/>\n        <text x=\"73\" y=\"104\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"5.4\" fill=\"${C.spec}\">SPEC</text>\n        <path d=\"M 96 66 L 116 66\" stroke=\"${C.a}\" stroke-width=\"1\"/>${pulse(96,66,116,66,C.spec,1.4)}\n        ${agent(134,66,13,\"Agent\",\"\")}\n        <path d=\"M 149 66 L 168 66\" stroke=\"${C.a}\" stroke-width=\"1\"/>${pulse(149,66,168,66,C.a,1.4)}\n        ${win(170,30,104,100,C.ok)}\n        ${row(180,46,60)}${row(180,54,84)}\n        <rect x=\"180\" y=\"64\" width=\"38\" height=\"24\" rx=\"3\" fill=\"rgba(52,211,153,.14)\" stroke=\"${C.ok}\" stroke-width=\".7\"/>\n        <rect x=\"224\" y=\"64\" width=\"38\" height=\"24\" rx=\"3\" fill=\"rgba(52,211,153,.14)\" stroke=\"${C.ok}\" stroke-width=\".7\"/>\n        <rect x=\"180\" y=\"96\" width=\"82\" height=\"8\" rx=\"3\" fill=\"${C.ok}\"/>\n        <text x=\"222\" y=\"122\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"5\" fill=\"${C.ok}\">fertige App ✓</text>\n        <path d=\"M 222 132 C 222 150, 73 150, 73 96\" stroke=\"${C.a}\" stroke-width=\".8\" stroke-dasharray=\"3 3\" fill=\"none\" opacity=\".6\"/>\n        ${cap(\"Eine ganze Anwendung · aus der Spezifikation gebaut und gegen sie geprüft\")}\n        ${grow(\"baut: 1 ganze App\")}\n      </svg>`;\n    }\n    // i===3 Orchestrierung — ein System aus mehreren Apps\n    const cols=[[64,\"Shop\"],[150,\"Konto\"],[236,\"Kasse\"]];\n    let branch=cols.map(c=>{const x=c[0];\n      return `<path d=\"M 150 58 L ${x} 74\" stroke=\"${C.a}\" stroke-width=\".8\" opacity=\".5\"/>${pulse(150,58,x,74,C.a,(1.3+Math.random()).toFixed(2))}\n      ${agent(x,80,8,\"\",\"\")}\n      ${win(x-26,96,52,40,C.ok)}\n      ${row(x-18,108,30)}${row(x-18,114,36)}\n      <rect x=\"${x-18}\" y=\"122\" width=\"24\" height=\"7\" rx=\"2.5\" fill=\"${C.ok}\"/>\n      <text x=\"${x}\" y=\"146\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"5\" fill=\"${C.ok}\">${c[1]}</text>`;}).join(\"\");\n    return `<svg viewBox=\"0 0 300 176\">\n      ${human(150,16,\"\")}\n      <text class=\"lab\" x=\"150\" y=\"31\" text-anchor=\"middle\" fill=\"${C.h}\">Ziele &amp; Leitplanken</text>\n      <path d=\"M 150 26 L 150 38\" stroke=\"${C.h}\" stroke-width=\".8\" stroke-dasharray=\"2 2\"/>\n      ${agent(150,50,11,\"\",\"Orchestrator\")}\n      ${branch}\n      <path d=\"M 64 138 H 236\" stroke=\"${C.ok}\" stroke-width=\".8\" opacity=\".45\" stroke-dasharray=\"4 3\"/>\n      ${cap(\"Ein Orchestrator steuert Subagenten · jede baut eine App, alle fügen sich zu einem System\")}\n      ${grow(\"baut: System aus mehreren Apps\")}\n    </svg>`;\n  }\n\n  /* ---------- build stepper ---------- */\n  const stepper=document.getElementById(\"stepper\");\n  stepper.innerHTML=STAGES.map((s,i)=>`<div class=\"step\" data-i=\"${i}\"><div class=\"dot\"></div><div class=\"nm\">${s.name}</div><div class=\"tg\">Stufe 0${i} · ${s.tag}</div></div>`).join(\"\");\n  stepper.querySelectorAll(\".step\").forEach(el=>el.addEventListener(\"click\",()=>{stopPlay(); select(+el.dataset.i);}));\n\n  /* ---------- build ladder skeleton ---------- */\n  const ladder=document.getElementById(\"ladder\");\n  ladder.innerHTML=RUNGS.map((r,i)=>`<div class=\"rung\" data-i=\"${i}\"><span class=\"rn\">0${i}</span><span>${r}</span></div>`).join(\"\");\n\n\n  /* ---------- select stage ---------- */\n  function select(i){\n    cur=i; const s=STAGES[i];\n    stepper.querySelectorAll(\".step\").forEach((el,idx)=>{el.classList.toggle(\"active\",idx===i); el.classList.toggle(\"done\",idx<i);});\n    document.getElementById(\"scTitle\").textContent=s.name;\n    document.getElementById(\"scUnit\").textContent=\"⬢ \"+s.unit;\n    const sv=document.getElementById(\"scSvg\"); sv.innerHTML=scene(i); sv.firstElementChild&&sv.firstElementChild.classList.add(\"sc-fade\");\n    document.getElementById(\"rHuman\").textContent=s.human;\n    document.getElementById(\"rAgent\").textContent=s.agent;\n    // splits\n    document.getElementById(\"splitBars\").innerHTML=Object.entries(s.split).map(([k,v])=>`\n      <div class=\"sp\"><div class=\"sp-top\"><span class=\"sp-nm\">${k}</span><span class=\"sp-val\">${v[0]}% · ${v[1]}%</span></div>\n      <div class=\"sp-bar\"><div class=\"sp-h\" style=\"width:${v[0]}%\"></div><div class=\"sp-a\" style=\"width:${v[1]}%\"></div></div></div>`).join(\"\");\n    // ladder\n    ladder.querySelectorAll(\".rung\").forEach((el,idx)=>el.classList.toggle(\"on\",idx===s.altitude));\n    document.getElementById(\"tTrait\").textContent=s.trait;\n    document.getElementById(\"tRisk\").textContent=s.risk;\n  }\n\n  /* ---------- play ---------- */\n  const playBtn=document.getElementById(\"play\");\n  function stopPlay(){ playing=false; clearInterval(timer); playBtn.textContent=\"▶ Evolution abspielen\"; }\n  playBtn.addEventListener(\"click\",()=>{\n    if(playing){ stopPlay(); return; }\n    playing=true; playBtn.textContent=\"⏸ Stopp\";\n    if(cur>=STAGES.length-1) select(0);\n    timer=setInterval(()=>{ if(cur>=STAGES.length-1){ stopPlay(); return; } select(cur+1); },2100);\n  });\n\n  select(0);\n})();\n\n/* scroll reveal */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObser
