ver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}}),{threshold:.1});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d5":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Der Produktivitäts-Sprung — Output je Evolutionsstufe</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --human:#f0864f; --human-d:#d1653a; --human-soft:rgba(240,134,79,.16);\n    --agent:#315a78; --agent-d:#264a64; --agent-soft:rgba(49,90,120,.16);\n    --ok:#34d399; --spec:#e8c15a;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.10);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--ink); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1000px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--agent)}\n\n  .hero{position:relative; padding:104px 0 46px; overflow:hidden}\n  .hero::before{content:\"\"; position:absolute; inset:-30% 25% auto -15%; height:440px; background:radial-gradient(closest-side,rgba(49,90,120,.20),transparent 70%); z-index:0}\n  .hero::after{content:\"\"; position:absolute; inset:14% -15% auto 46%; height:400px; background:radial-gradient(closest-side,rgba(52,211,153,.14),transparent 70%); z-index:0}\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(40px,6.6vw,74px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--agent)}\n  .thesis{font-size:clamp(18px,2.3vw,22px); color:#333333; max-width:700px; margin:22px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n\n  .stage{padding:48px 0; border-top:1px solid var(--line)}\n  .stage h2{font-size:clamp(26px,3.8vw,40px); margin:0}\n  .stage-sub{color:#5a5a5a; max-width:680px; margin:12px 0 0}\n\n  /* toggles */\n  .toggles{display:flex; flex-wrap:wrap; gap:22px; align-items:center; margin:26px 0 6px}\n  .tg{display:inline-flex; border:1px solid var(--line); border-radius:22px; overflow:hidden; font-family:\"Space Mono\",monospace; font-size:12.5px}\n  .tg button{border:none; background:none; color:var(--tx-soft); padding:8px 15px; cursor:pointer; transition:all .15s}\n  .tg button.on{background:var(--agent); color:#0a1526; font-weight:700}\n  .tg.disabled{opacity:.4; pointer-events:none}\n  .tg-lab{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-softer); margin-right:10px}\n\n  /* chart */\n  .chart-card{background:linear-gradient(180deg,#fcf8ee,#f0e9db); border:1px solid var(--line); border-radius:16px; padding:26px 24px 18px; box-shadow:var(--shadow); margin-top:18px}\n  .plot{position:relative; height:300px; margin-bottom:12px}\n  .bars{display:flex; align-items:flex-end; gap:14px; height:100%}\n  .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; cursor:pointer; position:relative}\n  .val{font-family:\"Space Mono\",monospace; font-weight:700; font-size:15px; margin-bottom:8px; color:#1a1a1a; white-space:nowrap; transition:color .2s}\n  .val small{display:block; font-weight:400; font-size:10px; color:var(--tx-soft); text-align:center}\n  .bar{width:74%; max-width:88px; border-radius:8px 8px 0 0; height:0; transition:height .7s cubic-bezier(.2,.7,.2,1), filter .2s, box-shadow .2s; position:relative}\n  .bar.human{background:linear-gradient(180deg,var(--human),var(--human-d))}\n  .bar.ai{background:linear-gradient(180deg,#7ba7c4,var(--agent-d))}\n  .col.sel .bar{box-shadow:0 0 0 2px #fff, 0 0 26px -2px rgba(49,90,120,.6); filter:saturate(1.15)}\n  .col.sel .val{color:var(--agent)}\n  .col.sel .bar.human{box-shadow:0 0 0 2px #fff, 0 0 26px -2px rgba(240,134,79,.6)}\n  .col:hover .bar{filter:brightness(1.08)}\n  .baseline{position:absolute; left:0; right:0; border-top:1.5px dashed var(--human); z-index:2; transition:bottom .7s cubic-bezier(.2,.7,.2,1)}\n  .baseline span{position:absolute; right:0; top:-9px; font-family:\"Space Mono\",monospace; font-size:10.5px; color:var(--human); background:var(--ink); padding:0 6px}\n  .xaxis{display:flex; gap:14px; margin-top:4px}\n  .xlab{flex:1; text-align:center; font-size:12px; color:var(--tx-soft); line-height:1.3}\n  .xlab b{color:#1a1a1a; display:block; font-weight:600; font-size:12.5px}\n  .xlab.base b{color:var(--human)}\n  .yhint{font-family:\"Space Mono\",monospace; font-size:10.5px; color:var(--tx-softer); margin-top:10px}\n\n  /* detail + caveat */\n  .below{display:grid; grid-template-columns:1.4fr 1fr; gap:18px; margin-top:22px}\n  @media(max-width:780px){.below{grid-template-columns:1fr}}\n  .detail{background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:22px}\n  .detail .dh{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:6px}\n  .detail .dname{font-family:'Newsreader',serif; font-weight:600; font-size:22px}\n  .detail .dfac{font-family:\"Space Mono\",monospace; font-weight:700; font-size:20px; color:var(--agent)}\n  .detail .dfac.base{color:var(--human)}\n  .detail .dtime{font-size:14px; color:#333333; margin:2px 0 14px; padding:10px 12px; background:var(--ink-3); border-radius:9px; line-height:1.45}\n  .detail .dtime b{color:#1a1a1a}\n  .detail .drow{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; font-size:13.5px}\n  .detail .k{font-family:\"Space Mono\",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-softer); padding-top:3px}\n  .detail .v{color:#5a5a5a; line-height:1.45}\n  .caveat{background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:22px}\n  .caveat .ch{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--spec); margin-bottom:10px}\n  .caveat p{font-size:13.5px; color:#5a5a5a; margin:0 0 10px; line-height:1.5}\n  .caveat p:last-child{margin:0}\n  .caveat b{color:#1a1a1a}\n\n  footer{padding:50px 0 90px; border-top:1px solid var(--line); color:var(--tx-softer); font-size:13.5px}\n  footer b{color:#5a5a5a}\n  footer .kick{font-family:'Newsreader',serif; font-size:20px; color:#1a1a1a; font-weight:500; margin:0 0 12px}\n\n  .reveal{opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none} .bar,.baseline{transition:none} *{scroll-behavior:auto!important}}\n  :focus-visible{outline:2px solid var(--agent); outline-offset:2px}\n\n    /* ===== christianmaass Standard-Typografie ===== */\n    body{background:#f6f1e8; color:#1a1a1a}\n    .eyebrow,.kicker,.stage-num{color:#315a78 !important}\n    h1,h2,h3{color:#1a1a1a}\n    .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); line-height:1.15; letter-spacing:-.01em}\n    .stage-sub,.thesis{font-size:1.05rem; line-height:1.6; color:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n    .hero::before,.hero::after{display:none !important}\n    .stage{border-top:none !important}\n  \n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">The Agentic Organization</div>\n    <h1>Der Produktivitäts-<em>Sprung</em></h1>\n  </div>\n</header>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n\n    <div class=\"toggles\">\n      <div><span class=\"tg-lab\">Ansicht</span>\n        <span class=\"tg\" id=\"tgMetric\"><button data-m=\"factor\" class=\"on\">Output ×</button><button data-m=\"time\">Zeit je Aufgabe</button></span>\n      </div>\n      <div><span class=\"tg-lab\">Skala</span>\n        <span class=\"tg\" id=\"tgScale\"><button data-s=\"lin\" class=\"on\">linear</button><button data-s=\"log\">gleichmäßiger Faktor</button></span>\n      </div>\n    </div>\n\n    <div class=\"chart-card\">\n      <div class=\"plot\">\n        <div class=\"baseline\" id=\"baseline\"><span>1× · normaler Entwickler</span></div>\n        <div class=\"bars\" id=\"bars\"></div>\n      </div>\n      <div class=\"xaxis\" id=\"xaxis\"></div>\n      <div class=\"yhint\" id=\"yhint\"></div>\n    </div>\n\n    <div class=\"below\">\n      <div class=\"detail\" id=\"detail\"></div>\n      <div class=\"caveat\">\n        <div class=\"ch\">Realitäts-Check</div>\n        <p><b>Größenordnungen, keine Messwerte.</b> Die Faktoren zeigen die Richtung, nicht eine gemessene Wahrheit — reale Effekte schwanken je nach Aufgabe stark.</p>\n        <p>Der Gewinn kommt nicht umsonst: Je höher die Stufe, desto mehr verschiebt sich der Aufwand zu <b>Spezifikation, Review und Integration</b>. Genau dort sitzt der neue Flaschenhals.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <p class=\"kick\">Nicht schneller tippen — anders arbeiten.</p>\n    <p>Der Sprung entsteht nicht dadurch, dass Menschen flinker werden, sondern dadurch, dass sich die <b>Arbeitseinheit</b> vergrößert und am Ende <b>parallelisiert</b>. Produktivität skaliert dann über Delegation statt über Köpfe — vorausgesetzt, Spezifikation und Aufsicht halten mit.</p>\n  </div>\n</footer>\n\n<script>\n(function(){\n  const reduce=window.matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\n  const STAGES=[\n    { name:\"Normaler Entwickler\", x:\"Basis\", factor:1, base:true,\n      time:\"1 Woche\", timeLine:\"Der Maßstab: eine Aufgabe = eine Arbeitswoche (5 Tage).\",\n      mech:\"Schreibt allen Code selbst und trifft jede Entscheidung.\", role:\"100% Mensch\" },\n    { name:\"+ Copilot\", x:\"Copilot\", factor:1.6, time:\"≈3 Tage\",\n      timeLine:\"Was ein normaler Entwickler in einer Woche macht, entsteht hier in <b>≈3 Tagen</b>.\",\n      mech:\"Schnelleres Tippen, weniger Nachschlagen — die KI vervollständigt Zeilen. Der Mensch schreibt weiter jede Zeile.\", role:\"Mensch baut · KI souffliert\" },\n    { name:\"+ Vibe Coding\", x:\"Vibe Coding\", factor:3, time:\"≈1,5 Tage\",\n      timeLine:\"Dieselbe Wochen-Aufgabe entsteht in <b>≈1,5 Tagen</b>.\",\n      mech:\"Ganze Blöcke entstehen auf Zuruf; iterieren statt tippen.\", role:\"Mensch beschreibt & beurteilt\" },\n    { name:\"+ Agentic Engineering\", x:\"Agentic Engineering\", factor:10, time:\"≈½ Tag\",\n      timeLine:\"Dieselbe Wochen-Aufgabe entsteht in <b>≈einem halben Tag</b>.\",\n      mech:\"Aus einer Spezifikation baut der Agent ein ganzes EPIC autonom und prüft sich selbst dagegen.\", role:\"Mensch spezifiziert & prüft\" },\n    { name:\"+ Agent-Orchestrierung\", x:\"Agent-Orchestrierung\", factor:30, time:\"≈1 Std.\",\n      timeLine:\"Dieselbe Wochen-Aufgabe entsteht in <b>gut einer Stunde</b>.\",\n      mech:\"Mehrere spezialisierte Agenten arbeiten parallel; der Output skaliert über Delegation statt über Köpfe.\", role:\"Mensch dirigiert & sichert ab\" }\n  ];\n  const MAXF=30, MAXH=40;\n  let metric=\"factor\", scale=\"lin\", sel=4;\n\n  function heightPct(st){\n    if(metric===\"time\"){ const h=MAXH/st.factor; return Math.max(2.5, h/MAXH*100); }\n    if(scale===\"log\"){ return Math.max(2.5, (Math.log10(st.factor)/Math.log10(MAXF))*100); }\n    return Math.max(2.2, st.factor/MAXF*100);\n  }\n  function valLabel(st){\n    if(metric===\"time\") return st.time;\n    const f=st.factor; return (f===Math.round(f)?f:String(f).replace(\".\",\",\"))+\"×\";\n  }\n\n  function build(){\n    document.getElementById(\"bars\").innerHTML=STAGES.map((st,i)=>`\n      <div class=\"col ${i===sel?'sel':''}\" data-i=\"${i}\">\n        <div class=\"val\">${valLabel(st)}${metric===\"time\"&&!st.base?'<small>statt 1 Woche</small>':''}</div>\n        <div class=\"bar ${st.base?'human':'ai'}\" style=\"height:0\"></div>\n      </div>`).join(\"\");\n    document.getElementById(\"xaxis\").innerHTML=STAGES.map(st=>`\n      <div class=\"xlab ${st.base?'base':''}\"><b>${st.x}</b></div>`).join(\"\");\n    document.querySelectorAll(\".col\").forEach(c=>c.addEventListener(\"click\",()=>{ sel=+c.dataset.i; refresh(); }));\n    requestAnimationFrame(()=>requestAnimationFrame(setHeights));\n    positionBaseline(); renderDetail(); renderHint();\n  }\n  function setHeights(){\n    document.querySelectorAll(\"#bars .col\").forEach((c,i)=>{ c.querySelector(\".bar\").style.height=heightPct(STAGES[i])+\"%\"; });\n  }\n  function positionBaseline(){\n    const bl=document.getElementById(\"baseline\");\n    if(metric===\"time\"){ bl.style.display=\"none\"; return; }\n    bl.style.display=\"block\";\n    bl.style.bottom=heightPct(STAGES[0])+\"%\";\n  }\n  function renderHint(){\n    const el=document.getElementById(\"yhint\");\n    el.innerHTML = metric===\"time\"\n      ? \"Höhe = Zeit für dieselbe Aufgabe · kürzer ist besser\"\n      : (scale===\"log\" ? \"Höhe = Output-Faktor (logarithmisch) — jede Stufe ist ein stetiges Vielfaches der vorherigen\"\n                       : \"Höhe = Output-Faktor (linear) — die oberen Stufen sind eine andere Größenordnung\");\n  }\n  function facLabel(st){ const f=st.factor; return (f===Math.round(f)?f:String(f).replace(\".\",\",\"))+\"×\"; }\n  function renderDetail(){\n    const st=STAGES[sel];\n    document.getElementById(\"detail\").innerHTML=`\n      <div class=\"dh\"><span class=\"dname\">${st.name}</span><span class=\"dfac ${st.base?'base':''}\">${st.base?'1× · Basis':facLabel(st)+' Output'}</span></div>\n      <div class=\"dtime\">${st.timeLine}</div>\n      <div class=\"drow\">\n        <span class=\"k\">Warum</span><span class=\"v\">${st.mech}</span>\n        <span class=\"k\">Rolle</span><span class=\"v\">${st.role}</span>\n      </div>`;\n  }\n  function refresh(){\n    document.querySelectorAll(\"#bars .col\").forEach((c,i)=>{\n      c.classList.toggle(\"sel\",i===sel);\n      c.querySelector(\".val\").innerHTML=valLabel(STAGES[i])+(metric===\"time\"&&!STAGES[i].base?'<small>statt 1 Woche</small>':'');\n    });\n    setHeights(); positionBaseline(); renderDetail(); renderHint();\n  }\n\n  document.getElementById(\"tgMetric\").addEventListener(\"click\",e=>{\n    const b=e.target.closest(\"button\"); if(!b)return;\n    metric=b.dataset.m;\n    document.querySelectorAll(\"#tgMetric button\").forEach(x=>x.classList.toggle(\"on\",x===b));\n    document.getElementById(\"tgScale\").classList.toggle(\"disabled\",metric===\"time\");\n    refresh();\n  });\n  document.getElementById(\"tgScale\").addEventListener(\"click\",e=>{\n    const b=e.target.closest(\"button\"); if(!b)return;\n    scale=b.dataset.s;\n    document.querySelectorAll(\"#tgScale button\").forEach(x=>x.classList.toggle(\"on\",x===b));\n    refresh();\n  });\n\n  build();\n})();\n\n/* scroll reveal */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObserver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}}),{threshold:.08});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d6":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Agentic-Commerce-Readiness — technische Voraussetzungen & typische Lücken</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --emer:#315a78; --emer-d:#264a64; --emer-soft:rgba(49,90,120,.16);\n    --l0:#e0664f; --l1:#e2a13a; --l2:#5b9df9; --l3:#34d399;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.10);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--ink); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1060px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--emer)}\n\n  .hero{position:relative; padding:104px 0 44px; overflow:hidden}\n  .hero::before{content:\"\"; position:absolute; inset:-30% 25% auto -15%; height:440px; background:radial-gradient(closest-side,rgba(49,90,120,.20),transparent 70%); z-index:0}\n  .hero::after{content:\"\"; position:absolute; inset:14% -15% auto 46%; height:400px; background:radial-gradient(closest-side,rgba(91,157,249,.13),transparent 70%); z-index:0}\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(38px,6.2vw,70px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--emer)}\n  .thesis{font-size:clamp(17px,2.2vw,21px); color:#d3d9dc; max-width:720px; margin:22px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n\n  .stage{padding:46px 0; border-top:1px solid var(--line)}\n  .stage h2{font-size:clamp(25px,3.6vw,38px); margin:0}\n  .stage-sub{color:#5a5a5a; max-width:700px; margin:12px 0 0}\n\n  /* level legend */\n  .levels{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 6px}\n  @media(max-width:720px){.levels{grid-template-columns:1fr 1fr}}\n  .lvl{padding:12px 14px; border-radius:11px; border:1px solid var(--line); background:var(--ink-2)}\n  .lvl .n{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase}\n  .lvl .t{font-weight:600; font-size:14px; margin-top:4px; color:#1a1a1a}\n  .lvl.l0{border-color:rgba(224,102,79,.4)} .lvl.l0 .n{color:var(--l0)}\n  .lvl.l1{border-color:rgba(226,161,58,.4)} .lvl.l1 .n{color:var(--l1)}\n  .lvl.l2{border-color:rgba(91,157,249,.4)} .lvl.l2 .n{color:var(--l2)}\n  .lvl.l3{border-color:rgba(52,211,153,.45)} .lvl.l3 .n{color:var(--l3)}\n\n  /* summary */\n  .summary{display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:22px 0 6px; padding:18px 20px; background:var(--ink-2); border:1px solid var(--line); border-radius:14px}\n  .score{display:flex; align-items:baseline; gap:10px}\n  .score .big{font-family:'Newsreader',serif; font-size:40px; font-weight:600; line-height:1; color:var(--emer)}\n  .score .lab{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-soft); max-width:110px; line-height:1.3}\n  .band{font-size:13px; color:#d3d9dc; padding:6px 12px; border:1px solid var(--line); border-radius:20px; font-family:\"Space Mono\",monospace}\n  .gaps{font-size:13px; color:var(--tx-soft); flex:1; min-width:220px}\n  .gaps b{color:var(--l0)}\n  .reset{margin-left:auto; font-family:\"Space Mono\",monospace; font-size:12px; color:var(--emer); background:var(--emer-soft); border:1px solid rgba(49,90,120,.4); border-radius:9px; padding:8px 14px; cursor:pointer}\n  .reset:hover{background:rgba(49,90,120,.24)}\n\n  /* matrix */\n  .grid2{display:grid; grid-template-columns:1.55fr 1fr; gap:20px; margin-top:20px}\n  @media(max-width:860px){.grid2{grid-template-columns:1fr}}\n  .rows{display:flex; flex-direction:column; gap:12px}\n  .dim{padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--ink-2); cursor:pointer; transition:border-color .2s}\n  .dim.sel{border-color:var(--emer)}\n  .dim-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px}\n  .dim-name{font-weight:600; font-size:14.5px}\n  .dim-prob{font-size:11px; color:var(--tx-soft); font-family:\"Space Mono\",monospace; text-align:right; max-width:52%}\n  .track{display:flex; gap:5px}\n  .seg{flex:1; border-radius:6px; padding:8px 6px 7px; text-align:center; cursor:pointer; border:1px solid transparent; transition:all .18s; background:var(--ink-3); position:relative}\n  .seg .st{font-family:\"Space Mono\",monospace; font-size:9px; color:var(--tx-softer); display:block; margin-bottom:3px}\n  .seg .sl{font-size:11px; font-weight:600; color:var(--tx-soft); line-height:1.2}\n  .seg:hover{border-color:var(--tx-softer)}\n  .seg.gap{border:1px dashed rgba(0,0,0,.18)}\n  .seg.cur{color:#0b0f12}\n  .seg.cur .st,.seg.cur .sl{color:#0b0f12}\n  .seg.cur.c0{background:var(--l0)} .seg.cur.c1{background:var(--l1)} .seg.cur.c2{background:var(--l2)} .seg.cur.c3{background:var(--l3)}\n  .seg.cur .sl{font-weight:700}\n  .seg .flag{position:absolute; top:-7px; right:4px; font-size:8px; font-family:\"Space Mono\",monospace; color:var(--l3)}\n\n  /* detail */\n  .detail{padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--ink-2); align-self:start; position:sticky; top:20px}\n  .detail .dh{font-family:'Newsreader',serif; font-weight:600; font-size:21px; margin:0 0 4px}\n  .detail .dprob{font-size:13px; color:#e79f86; margin:0 0 16px; padding:10px 12px; background:rgba(224,102,79,.10); border:1px solid rgba(224,102,79,.3); border-radius:9px; line-height:1.45}\n  .detail .dprob b{color:#f4b8a3}\n  .lstep{display:flex; gap:11px; margin-bottom:12px}\n  .lstep:last-child{margin-bottom:0}\n  .lstep .num{flex:0 0 auto; width:22px; height:22px; border-radius:6px; font-family:\"Space Mono\",monospace; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center}\n  .lstep.c0 .num{background:rgba(224,102,79,.2); color:var(--l0)}\n  .lstep.c1 .num{background:rgba(226,161,58,.2); color:var(--l1)}\n  .lstep.c2 .num{background:rgba(91,157,249,.2); color:var(--l2)}\n  .lstep.c3 .num{background:rgba(52,211,153,.2); color:var(--l3)}\n  .lstep .lt{font-size:13.5px; color:#5a5a5a; line-height:1.45}\n  .lstep .lt b{color:#1a1a1a}\n  .lstep.is-cur{background:var(--ink-3); border-radius:9px; padding:8px 10px; margin:-8px -10px 4px}\n  .lstep.is-cur .lt b{color:var(--emer)}\n  .dgap{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-family:\"Space Mono\",monospace; font-size:12px; color:var(--tx-soft)}\n  .dgap b{color:var(--l3)}\n\n  .hint{font-size:12.5px; color:var(--tx-softer); margin-top:14px; font-style:italic}\n\n  footer{padding:50px 0 90px; border-top:1px solid var(--line); color:var(--tx-softer); font-size:13.5px}\n  footer b{color:#5a5a5a}\n  footer .kick{font-family:'Newsreader',serif; font-size:20px; color:#1a1a1a; font-weight:500; margin:0 0 12px}\n\n  .reveal{opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none} *{scroll-behavior:auto!important}}\n  :focus-visible{outline:2px solid var(--emer); outline-offset:2px}\n\n    /* ===== christianmaass Standard-Typografie ===== */\n    body{background:#f6f1e8; color:#1a1a1a}\n    .eyebrow,.kicker,.stage-num{color:#315a78 !important}\n    h1,h2,h3{color:#1a1a1a}\n    .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); line-height:1.15; letter-spacing:-.01em}\n    .stage-sub,.thesis{font-size:1.05rem; line-height:1.6; color:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n    .hero::before,.hero::after{display:none !important}\n    .stage{border-top:none !important}\n  \n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">The Agentic Organization</div>\n    <h1>Bereit für <em>Agentic Commerce</em>?</h1>\n  </div>\n</header>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <h2>Die Reifegrade</h2>\n    <div class=\"levels\">\n      <div class=\"lvl l0\"><div class=\"n\">Stufe 0</div><div class=\"t\">menschzentriert</div></div>\n      <div class=\"lvl l1\"><div class=\"n\">Stufe 1</div><div class=\"t\">API-fähig</div></div>\n      <div class=\"lvl l2\"><div class=\"n\">Stufe 2</div><div class=\"t\">echtzeit- & datenreif</div></div>\n      <div class=\"lvl l3\"><div class=\"n\">Stufe 3</div><div class=\"t\">agent-nativ</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <h2>Voraussetzungen & typische Lücken</h2>\n    <p class=\"stage-sub\">Voreingestellt ist eine typische Mittelstands-Ausgangslage.</p>\n\n    <div class=\"summary\">\n      <div class=\"score\"><span class=\"big\" id=\"scoreBig\">–</span><span class=\"lab\">Agentic-Commerce-Readiness</span></div>\n      <span class=\"band mono\" id=\"band\"></span>\n      <div class=\"gaps\" id=\"gaps\"></div>\n      <button class=\"reset\" id=\"reset\">↺ typische Ausgangslage</button>\n    </div>\n\n    <div class=\"grid2\">\n      <div class=\"rows\" id=\"rows\"></div>\n      <div class=\"detail\" id=\"detail\"></div>\n    </div>\n    <p class=\"hint\">Hinweis: Illustrative Einordnung typischer Mittelstands-Muster — kein Audit eines konkreten Unternehmens. Und: Man muss nicht überall gleichzeitig auf Stufe 3. Die Reihenfolge zählt — saubere Produktdaten, Echtzeit und API-first sind meist die Voraussetzung für alles andere.</p>\n  </div>\n</section>\n\n<script>\n(function(){\n  const DIMS=[\n    { name:\"ERP / OMS (Auftragskern)\",\n      prob:\"Monolithisch, batch-Sync, kaum Echtzeit-APIs\",\n      levels:[\n        {t:\"Monolith\",   d:\"Historisch gewachsenes ERP (oft MSSQL-basiert), Zugriff nur über UI und nächtliche Exporte.\"},\n        {t:\"erste APIs\", d:\"Einzelne REST-Schnittstellen als Bolt-on aufgesetzt, aber ohne durchgängiges Modell.\"},\n        {t:\"Echtzeit-OMS\",d:\"Ein Order-Management-Layer liefert Bestände und Auftragsstatus in Echtzeit.\"},\n        {t:\"event-nativ\",d:\"Idempotente Order-APIs, Webhooks und Events — Agenten können sicher Aufträge auslösen.\"}\n      ]},\n    { name:\"Produktdaten / PIM\",\n      prob:\"Kein echtes PIM, Attribute in Shop-DB & Excel\",\n      levels:[\n        {t:\"verstreut\",  d:\"Produktdaten liegen in Shop-Datenbank und Tabellen, uneinheitliche Attribute und Taxonomie.\"},\n        {t:\"PIM im Aufbau\",d:\"Zentrales PIM eingeführt, Datenpflege und Vollständigkeit noch in Arbeit.\"},\n        {t:\"normalisiert\",d:\"Vollständige, normalisierte Attribute mit sauberer Taxonomie und Data-Quality-Gates.\"},\n        {t:\"maschinenlesbar\",d:\"Semantisch angereichert (schema.org, Embeddings) — von Agenten direkt konsumierbar.\"}\n      ]},\n    { name:\"Architektur / API\",\n      prob:\"Monolith, Logik mit UI verwoben (z. B. PHP-Checkout)\",\n      levels:[\n        {t:\"Monolith\",   d:\"Shop-Logik eng mit der Oberfläche gekoppelt, kaum wiederverwendbare Dienste.\"},\n        {t:\"Strangler\",  d:\"Erste Domänen als Services herausgelöst (Strangler-Fig-Migration begonnen).\"},\n        {t:\"headless\",   d:\"Composable/headless Aufbau mit sauberen Domain-APIs für Katalog, Cart, Checkout.\"},\n        {t:\"API-first\",  d:\"Durchgängig contract-first und für Maschinen ausgelegt — UI ist nur ein Client von vielen.\"}\n      ]},\n    { name:\"Echtzeit-Daten (Bestand & Preis)\",\n      prob:\"Nächtlicher Batch-Sync — Preise & Verfügbarkeit veralten\",\n      levels:[\n        {t:\"Batch\",      d:\"Bestände und Preise werden nächtlich oder stündlich synchronisiert.\"},\n        {t:\"near-real\",  d:\"Häufigere Syncs, aber ohne Garantie zum Abfragezeitpunkt.\"},\n        {t:\"Streaming\",  d:\"Event-Streaming liefert Verfügbarkeit und Preis in Echtzeit.\"},\n        {t:\"garantiert\", d:\"Echtzeit inkl. Reservierung/Locking, damit Agent-Transaktionen verlässlich sind.\"}\n      ]},\n    { name:\"Identität & delegierte Auth\",\n      prob:\"Kundenidentität fragmentiert, keine Agent-Delegation\",\n      levels:[\n        {t:\"Silo-Login\", d:\"Getrennte Logins je System, keine Delegation an Dritte oder Agenten.\"},\n        {t:\"SSO\",        d:\"Zentrale Identität über Single Sign-On etabliert.\"},\n        {t:\"Scopes\",     d:\"OAuth-Scopes und feingranulare Berechtigungen für Zugriffe.\"},\n        {t:\"delegiert\",  d:\"Agenten handeln nachweislich „im Auftrag von“ — mit Consent und Agent-Authentifizierung.\"}\n      ]},\n    { name:\"Payment (agent-fähig)\",\n      prob:\"Checkout an menschliche Flows gebunden\",\n      levels:[\n        {t:\"nur Mensch\", d:\"Bezahlung ausschließlich im menschlichen Checkout-Flow möglich.\"},\n        {t:\"moderner PSP\",d:\"Aktueller Payment-Provider (Adyen-Klasse) mit Tokenisierung im Einsatz.\"},\n        {t:\"programmatisch\",d:\"Programmatische Zahlungen und gespeicherte Mandate für wiederkehrende Käufe.\"},\n        {t:\"agentic pay\",d:\"Agentic-Payment-Protokolle mit delegierten Kauf-Limits und Freigaben.\"}\n      ]},\n    { name:\"Discovery / Semantik\",\n      prob:\"Keyword-Suche ohne echtes Intent-Verständnis\",\n      levels:[\n        {t:\"Keyword\",    d:\"Klassische Keyword-Suche, Treffer über Textabgleich.\"},\n        {t:\"Relevanz+\",  d:\"Verbesserte Facetten und Relevanz (Searchhub-Klasse).\"},\n        {t:\"semantisch\", d:\"Vektor-/semantische Suche versteht Bedeutung statt nur Wörter.\"},\n        {t:\"agent-abfragbar\",d:\"Intent- & Kompatibilitäts-Reasoning als Tool-/Function-API, die Agenten aufrufen.\"}\n      ]},\n    { name:\"Governance & Trust (Agent-Verkehr)\",\n      prob:\"Kein Unterschied guter Agent vs. Scraper, keine Audit-Trails\",\n      levels:[\n        {t:\"kein Konzept\",d:\"Alles menschlich gedacht — automatisierter Verkehr ist nicht vorgesehen.\"},\n        {t:\"Bot-Mgmt\",   d:\"Bot-Management und Rate-Limiting am Edge (z. B. Cloudflare).\"},\n        {t:\"Allowlist\",  d:\"Zugelassene Agenten mit Quotas, Verträgen und Observability.\"},\n        {t:\"signiert\",   d:\"Signierte Agent-Identität, lückenlose Audit-Trails und Betrugskontrolle.\"}\n      ]},\n  ];\n  const TARGET=3;\n  const DEFAULT=[0,1,1,0,1,1,1,1];\n  let cur=DEFAULT.slice(), sel=0;\n\n  function band(p){ return p<30?\"menschzentriert\":p<55?\"im Umbau\":p<80?\"datenreif\":\"agent-nativ\"; }\n\n  function renderRows(){\n    document.getElementById(\"rows\").innerHTML=DIMS.map((d,di)=>`\n      <div class=\"dim ${di===sel?'sel':''}\" data-d=\"${di}\">\n        <div class=\"dim-top\"><span class=\"dim-name\">${d.name}</span><span class=\"dim-prob\">${d.prob}</span></div>\n        <div class=\"track\">${d.levels.map((l,li)=>{\n          const isCur=li===cur[di], isGap=li>cur[di]&&li<=TARGET;\n          return `<div class=\"seg ${isCur?'cur c'+li:''} ${isGap?'gap':''}\" data-d=\"${di}\" data-l=\"${li}\">\n            ${li===TARGET?'<span class=\"flag\">▲ Ziel</span>':''}\n            <span class=\"st\">Stufe ${li}</span><span class=\"sl\">${l.t}</span></div>`;\n        }).join(\"\")}</div>\n      </div>`).join(\"\");\n  }\n  function renderDetail(){\n    const d=DIMS[sel], lv=cur[sel];\n    document.getElementById(\"detail\").innerHTML=`\n      <div class=\"dh\">${d.name}</div>\n      <div class=\"dprob\"><b>Typisches Problem:</b> ${d.prob}.</div>\n      ${d.levels.map((l,li)=>`\n        <div class=\"lstep c${li} ${li===lv?'is-cur':''}\">\n          <span class=\"num\">${li}</span>\n          <span class=\"lt\"><b>${l.t}${li===lv?' · aktuell':''}</b><br>${l.d}</span>\n        </div>`).join(\"\")}\n      <div class=\"dgap\">Lücke bis agent-nativ: <b>${TARGET-lv} Stufe${TARGET-lv===1?'':'n'}</b></div>`;\n  }\n  function renderSummary(){\n    const sum=cur.reduce((a,b)=>a+b,0), pct=Math.round(sum/(DIMS.length*TARGET)*100);\n    document.getElementById(\"scoreBig\").textContent=pct+\"%\";\n    document.getElementById(\"band\").textContent=\"Reifegrad: \"+band(pct);\n    const gaps=DIMS.map((d,i)=>({n:d.name,l:cur[i]})).filter(x=>x.l<=1).sort((a,b)=>a.l-b.l).slice(0,3);\n    document.getElementById(\"gaps\").innerHTML = gaps.length\n      ? \"Größte Baustellen: \"+gaps.map(g=>`<b>${g.n.split(\" (\")[0].split(\" / \")[0]}</b>`).join(\", \")\n      : \"Solide Basis über alle Dimensionen.\";\n  }\n  function renderAll(){ renderRows(); renderDetail(); renderSummary(); }\n\n  document.getElementById(\"reset\").addEventListener(\"click\",()=>{ cur=DEFAULT.slice(); renderAll(); });\n  document.getElementById(\"rows\").addEventListener(\"click\",e=>{\n    const seg=e.target.closest(\".seg\");\n    if(seg){ cur[+seg.dataset.d]=+seg.dataset.l; sel=+seg.dataset.d; renderAll(); return; }\n    const dim=e.target.closest(\".dim\");\n    if(dim){ sel=+dim.dataset.d; renderAll(); }\n  });\n  renderAll();\n})();\n\n/* scroll reveal */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObserver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}}),{threshold:.08});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d7":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Der Reifegrad-Rückstand — Ist vs. agent-natives Ziel</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#f6f1e8; --ink-2:#fcf8ee; --ink-3:#efe7d4;\n    --emer:#2fb39a; --emer-soft:rgba(47,179,154,.16);\n    --l0:#e0664f; --l1:#e2a13a; --l2:#5b9df9; --l3:#34d399;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.10);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.18);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--ink); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1040px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08}\n  .mono{font-family:\"Space Mono\",ui-monospace,monospace}\n  .eyebrow{font-family:\"Space Mono\",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--emer)}\n\n  .hero{position:relative; padding:102px 0 42px; overflow:hidden}\n  .hero::before{content:\"\"; position:absolute; inset:-30% 30% auto -15%; height:440px; background:radial-gradient(closest-side,rgba(224,102,79,.16),transparent 70%); z-index:0}\n  .hero::after{content:\"\"; position:absolute; inset:14% -15% auto 48%; height:400px; background:radial-gradient(closest-side,rgba(47,179,154,.16),transparent 70%); z-index:0}\n  .hero .wrap{position:relative; z-index:1}\n  .hero h1{font-size:clamp(38px,6.2vw,70px); margin:20px 0 0}\n  .hero h1 em{font-style:italic; color:var(--l0)}\n  .thesis{font-size:clamp(17px,2.2vw,21px); color:#d3d9dc; max-width:720px; margin:22px 0 0; line-height:1.5}\n  .thesis b{color:#1a1a1a; font-weight:600}\n\n  .stage{padding:46px 0; border-top:1px solid var(--line)}\n  .stage h2{font-size:clamp(25px,3.6vw,38px); margin:0}\n  .stage-sub{color:#5a5a5a; max-width:700px; margin:12px 0 0}\n\n  .radar-wrap{display:grid; grid-template-columns:1.35fr 1fr; gap:22px; margin-top:24px; align-items:center}\n  @media(max-width:820px){.radar-wrap{grid-template-columns:1fr}}\n  .radar-card{background:linear-gradient(180deg,#fcf8ee,#f0e9db); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow)}\n  .radar-card svg{width:100%; height:auto; display:block}\n  .r-axis-lab{font-family:'Montserrat',sans-serif; font-size:10px; font-weight:600; fill:#333333}\n  .r-ring-lab{font-family:\"Space Mono\",monospace; font-size:7px; fill:#5f6c72}\n\n  .side .metric{background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px}\n  .side .metric .k{font-family:\"Space Mono\",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-soft)}\n  .side .metric .v{font-family:'Newsreader',serif; font-size:44px; font-weight:600; line-height:1; margin-top:6px}\n  .side .metric .v.bad{color:var(--l0)}\n  .side .metric .sub{font-size:13px; color:#5a5a5a; margin-top:8px}\n  .side .metric .sub b{color:#1a1a1a}\n  .legend2{display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--tx-soft); margin:4px 0 0}\n  .legend2 span{display:inline-flex; align-items:center; gap:7px}\n  .legend2 i{width:12px; height:12px; border-radius:3px; display:inline-block}\n  .r-controls{display:flex; align-items:center; gap:12px; margin-top:14px}\n  .reset{font-family:\"Space Mono\",monospace; font-size:12px; color:var(--emer); background:var(--emer-soft); border:1px solid rgba(47,179,154,.4); border-radius:9px; padding:8px 14px; cursor:pointer}\n  .reset:hover{background:rgba(47,179,154,.24)}\n  .r-hint{font-size:12px; color:var(--tx-softer); font-style:italic}\n\n  /* distribution */\n  .levels{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:22px 0 18px}\n  @media(max-width:640px){.levels{grid-template-columns:1fr 1fr}}\n  .lvl{padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--ink-2)}\n  .lvl .n{font-family:\"Space Mono\",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase}\n  .lvl .t{font-weight:600; font-size:13px; margin-top:3px; color:#1a1a1a}\n  .lvl.l0{border-color:rgba(224,102,79,.4)} .lvl.l0 .n{color:var(--l0)}\n  .lvl.l1{border-color:rgba(226,161,58,.4)} .lvl.l1 .n{color:var(--l1)}\n  .lvl.l2{border-color:rgba(91,157,249,.4)} .lvl.l2 .n{color:var(--l2)}\n  .lvl.l3{border-color:rgba(52,211,153,.45)} .lvl.l3 .n{color:var(--l3)}\n\n  .dist-head{display:flex; flex-wrap:wrap; gap:16px; align-items:center; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px}\n  .dist-head .big{font-family:'Newsreader',serif; font-size:38px; font-weight:600; color:var(--l0); line-height:1}\n  .dist-head .txt{font-size:14px; color:#5a5a5a; flex:1; min-width:220px}\n  .dist-head .txt b{color:#1a1a1a}\n  .distrow{display:grid; grid-template-columns:130px 1fr; gap:14px; align-items:center; margin-bottom:9px}\n  @media(max-width:560px){.distrow{grid-template-columns:96px 1fr}}\n  .distrow .dn{font-size:13px; color:#333333; font-weight:500}\n  .stackbar{display:flex; height:20px; border-radius:5px; overflow:hidden; border:1px solid var(--line)}\n  .stackbar .seg{height:100%; transition:width .5s}\n  .stackbar .s0{background:var(--l0)} .stackbar .s1{background:var(--l1)} .stackbar .s2{background:var(--l2)} .stackbar .s3{background:var(--l3)}\n  .distnote{font-size:12px; color:var(--tx-softer); font-style:italic; margin-top:14px}\n\n  footer{padding:50px 0 90px; border-top:1px solid var(--line); color:var(--tx-softer); font-size:13.5px}\n  footer b{color:#5a5a5a}\n  footer .kick{font-family:'Newsreader',serif; font-size:20px; color:#1a1a1a; font-weight:500; margin:0 0 12px}\n\n  .reveal{opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none} *{scroll-behavior:auto!important}}\n  :focus-visible{outline:2px solid var(--emer); outline-offset:2px}\n\n    /* ===== christianmaass Standard-Typografie ===== */\n    body{background:#f6f1e8; color:#1a1a1a}\n    .eyebrow,.kicker,.stage-num{color:#315a78 !important}\n    h1,h2,h3{color:#1a1a1a}\n    .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); line-height:1.15; letter-spacing:-.01em}\n    .stage-sub,.thesis{font-size:1.05rem; line-height:1.6; color:#1a1a1a}\n    .stage-sub b,.thesis b{color:#000}\n    .hero{padding:44px 0 34px !important}\n    .hero h1{font-size:clamp(1.8rem,3.9vw,3.0rem) !important; line-height:1.15 !important; letter-spacing:-.01em !important; margin:6px 0 0 !important}\n    .hero .thesis{margin-top:12px !important; max-width:64ch}\n  \n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">Interaktiver Explainer · Commerce-Infrastruktur</div>\n    <h1>Der <em>Rückstand</em>, sichtbar gemacht</h1>\n    <p class=\"thesis\">Die Matrix zeigt <b>was</b> fehlt. Diese Folie zeigt <b>wie weit weg</b> das Ziel ist — und dass es fast alle betrifft. Innen die geschrumpfte Ist-Fläche eines typischen Mittelständlers, außen das agent-native Ziel. Der Abstand dazwischen ist die eigentliche Botschaft.</p>\n  </div>\n</header>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <h2>Ist vs. Ziel</h2>\n    <p class=\"stage-sub\">Die grüne Außenkontur ist „agent-nativ\" auf jeder Achse. Die rote Fläche ist der typische Ist-Zustand. Klick auf die Punkte einer Achse, um den Ist-Reifegrad zu setzen.</p>\n\n    <div class=\"radar-wrap\">\n      <div class=\"radar-card\"><svg id=\"radar\" viewBox=\"0 0 440 384\" aria-label=\"Radar: Ist-Reifegrad vs. agent-natives Ziel\"></svg></div>\n      <div class=\"side\">\n        <div class=\"metric\">\n          <div class=\"k\">Erreichter Reifegrad</div>\n          <div class=\"v bad\" id=\"readi\">–</div>\n          <div class=\"sub\" id=\"gapline\"></div>\n        </div>\n        <div class=\"legend2\">\n          <span><i style=\"background:rgba(224,102,79,.7)\"></i>Ist (typisch)</span>\n          <span><i style=\"background:rgba(52,211,153,.7)\"></i>Ziel · agent-nativ</span>\n        </div>\n        <div class=\"r-controls\">\n          <button class=\"reset\" id=\"reset\">↺ typische Ausgangslage</button>\n        </div>\n        <p class=\"r-hint\">Achsen: die acht technischen Voraussetzungen · Ringe: Stufe 0 → 3.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <h2>Und das betrifft fast alle</h2>\n    <p class=\"stage-sub\">Es ist kein Einzelfall: Verteilt man die Unternehmen über die vier Reifegrade, klebt die Masse links. Rechts — agent-nativ — steht fast niemand.</p>\n\n    <div class=\"levels\">\n      <div class=\"lvl l0\"><div class=\"n\">Stufe 0</div><div class=\"t\">menschzentriert</div></div>\n      <div class=\"lvl l1\"><div class=\"n\">Stufe 1</div><div class=\"t\">API-fähig</div></div>\n      <div class=\"lvl l2\"><div class=\"n\">Stufe 2</div><div class=\"t\">echtzeit- & datenreif</div></div>\n      <div class=\"lvl l3\"><div class=\"n\">Stufe 3</div><div class=\"t\">agent-nativ</div></div>\n    </div>\n\n    <div class=\"dist-head\">\n      <span class=\"big\" id=\"distBig\">–</span>\n      <div class=\"txt\" id=\"distTxt\"></div>\n    </div>\n\n    <div id=\"dist\"></div>\n    <p class=\"distnote\">Illustrative Branchenverteilung typischer Mittelständler — Größenordnungen zur Veranschaulichung, keine erhobene Statistik.</p>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <p class=\"kick\">Ein kleiner roter Kern in einem großen leeren Ring.</p>\n    <p>Der Rückstand ist real und branchenweit — und genau das ist die Chance. Wer das Fundament (<b>Produktdaten, Echtzeit, offene APIs</b>) zuerst schließt, differenziert sich in einem Feld, in dem fast niemand bereit ist. Die Lücke ist nicht das Problem, sondern der Vorsprung, der zu holen ist.</p>\n  </div>\n</footer>\n\n<script>\n(function(){\n  const AXES=[\"ERP / OMS\",\"PIM\",\"API / Architektur\",\"Echtzeit-Daten\",\"Identität & Auth\",\"Payment\",\"Discovery\",\"Governance\"];\n  const DEFAULT=[0,1,1,0,1,1,1,1];\n  const TARGET=3, N=AXES.length;\n  let cur=DEFAULT.slice();\n\n  const cx=220, cy=180, R=118, labR=R+24;\n  const ang=i=>(-90 + i*(360/N))*Math.PI/180;\n  const rad=v=>(0.09 + (v/3)*0.91)*R;      // Stufe 0 leicht vom Zentrum abgesetzt (klickbar)\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rad(v), cy+Math.sin(ang(i))*rad(v)];\n  const ringPt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];\n\n  function poly(pts){ return pts.map(p=>p[0].toFixed(1)+\",\"+p[1].toFixed(1)).join(\" \"); }\n\n  function render(){\n    let h=\"\";\n    // concentric maturity rings (0..3)\n    for(let v=0; v<=3; v++){\n      const r=rad(v);\n      const ring=[]; for(let i=0;i<N;i++) ring.push(ringPt(i,r));\n      const isTarget=v===3;\n      h+=`<polygon points=\"${poly(ring)}\" fill=\"${isTarget?'rgba(52,211,153,.05)':'none'}\" stroke=\"${isTarget?'#34d399':'rgba(0,0,0,.10)'}\" stroke-width=\"${isTarget?'1.4':'0.8'}\" ${isTarget?'stroke-dasharray=\"5 4\"':''}/>`;\n    }\n    // spokes + tick dots\n    for(let i=0;i<N;i++){\n      const outer=ringPt(i,R);\n      h+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${outer[0].toFixed(1)}\" y2=\"${outer[1].toFixed(1)}\" stroke=\"rgba(0,0,0,.07)\" stroke-width=\"0.7\"/>`;\n      for(let v=0;v<=3;v++){ const p=pt(i,v);\n        h+=`<circle class=\"tick\" cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"4.6\" fill=\"transparent\" data-a=\"${i}\" data-v=\"${v}\" style=\"cursor:pointer\"/>\n            <circle cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"1.6\" fill=\"rgba(0,0,0,.18)\" pointer-events=\"none\"/>`;\n      }\n    }\n    // IST polygon\n    const ist=[]; for(let i=0;i<N;i++) ist.push(pt(i,cur[i]));\n    h+=`<polygon points=\"${poly(ist)}\" fill=\"rgba(224,102,79,.22)\" stroke=\"#e0664f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/>`;\n    for(let i=0;i<N;i++){ const p=pt(i,cur[i]); h+=`<circle cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"3.4\" fill=\"#e0664f\" stroke=\"#101519\" stroke-width=\"1\" pointer-events=\"none\"/>`; }\n    // ZIEL vertices (green dots at level 3)\n    for(let i=0;i<N;i++){ const p=pt(i,3); h+=`<circle cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"2.4\" fill=\"#34d399\" pointer-events=\"none\"/>`; }\n    // axis labels\n    for(let i=0;i<N;i++){\n      const a=ang(i), lx=cx+Math.cos(a)*labR, ly=cy+Math.sin(a)*labR;\n      let anchor=\"middle\"; if(Math.cos(a)>0.3) anchor=\"start\"; else if(Math.cos(a)<-0.3) anchor=\"end\";\n      h+=`<text class=\"r-axis-lab\" x=\"${lx.toFixed(1)}\" y=\"${(ly+3).toFixed(1)}\" text-anchor=\"${anchor}\">${AXES[i]}</text>`;\n    }\n    document.getElementById(\"radar\").innerHTML=h;\n    document.querySelectorAll(\"#radar .tick\").forEach(t=>t.addEventListener(\"click\",()=>{ cur[+t.dataset.a]=+t.dataset.v; render(); metrics(); }));\n  }\n  function metrics(){\n    const sum=cur.reduce((a,b)=>a+b,0), pct=Math.round(sum/(N*TARGET)*100), gap=N*TARGET-sum;\n    document.getElementById(\"readi\").textContent=pct+\"%\";\n    document.getElementById(\"gapline\").innerHTML=`<b>${gap} von ${N*TARGET}</b> Reifegrad-Stufen fehlen bis agent-nativ.`;\n  }\n  document.getElementById(\"reset\").addEventListener(\"click\",()=>{ cur=DEFAULT.slice(); render(); metrics(); });\n  render(); metrics();\n\n  /* ---- Branchenverteilung ---- */\n  const DIST=[\n    [\"ERP / OMS\",        [55,30,12,3]],\n    [\"PIM\",              [45,33,17,5]],\n    [\"API / Architektur\",[48,30,17,5]],\n    [\"Echtzeit-Daten\",   [58,27,12,3]],\n    [\"Identität & Auth\", [40,35,20,5]],\n    [\"Payment\",          [30,40,22,8]],\n    [\"Discovery\",        [42,33,20,5]],\n    [\"Governance\",       [50,32,14,4]]\n  ];\n  document.getElementById(\"dist\").innerHTML=DIST.map(d=>`\n    <div class=\"distrow\"><span class=\"dn\">${d[0]}</span>\n      <div class=\"stackbar\">${d[1].map((w,li)=>`<div class=\"seg s${li}\" style=\"width:${w}%\" title=\"Stufe ${li}: ${w}%\"></div>`).join(\"\")}</div>\n    </div>`).join(\"\");\n  // headline stats from data\n  const avgLevel = DIST.reduce((a,d)=>a+(d[1][1]*1+d[1][2]*2+d[1][3]*3)/100,0)/DIST.length;\n  const avgL3 = Math.round(DIST.reduce((a,d)=>a+d[1][3],0)/DIST.length);\n  document.getElementById(\"distBig\").textContent=avgLevel.toFixed(1).replace(\".\",\",\")+\" / 3\";\n  document.getElementById(\"distTxt\").innerHTML=`Ø-Reifegrad der Branche über alle Dimensionen. Nur rund <b>${avgL3} %</b> erreichen je Dimension „agent-nativ\" — die große Mehrheit sitzt auf Stufe 0–1 fest.`;\n})();\n\n/* scroll reveal */\n(function(){\n  const els=document.querySelectorAll(\".reveal\");\n  if(!(\"IntersectionObserver\"in window)){els.forEach(e=>e.classList.add(\"in\"));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add(\"in\");io.unobserve(x.target);}}),{threshold:.08});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","d8":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Agentic Commerce bedroht alle — Thomann Music</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\" />\n<style>\n  :root{\n    --bg:#f6f1e8; --bg2:#fcf8ee; --bg3:#efe7d4;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.12);\n    --petrol:#315a78; --petrol-d:#264a64; --petrol-soft:rgba(49,90,120,.10);\n    --risk:#d1653a; --risk-soft:rgba(209,101,58,.12);\n    --shadow:0 18px 44px -24px rgba(0,0,0,.20);\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0; background:var(--bg); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-weight:300; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1040px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader','Source Serif Pro',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.15; color:#1a1a1a}\n  .mono{font-family:'Space Mono',ui-monospace,monospace}\n\n  .stage{padding:46px 0}\n  .eyebrow{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--petrol); margin-bottom:10px}\n  .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); margin:0}\n  .stage h2 .accent{color:var(--petrol); font-style:italic}\n  .stage-sub{color:#1a1a1a; max-width:64ch; margin:12px 0 0; font-size:1.05rem; line-height:1.6}\n\n  .thesis-line{margin:18px 0 0; font-size:.95rem; color:var(--tx-soft); border-left:3px solid var(--petrol); padding-left:12px; max-width:60ch}\n  .thesis-line b{color:#1a1a1a}\n\n  /* toggle */\n  .toggles{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:24px 0 4px}\n  .seg{display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg2)}\n  .seg button{border:none; background:none; color:var(--tx-soft); font-family:'Montserrat',sans-serif; font-size:13.5px; font-weight:500;\n    padding:10px 16px; cursor:pointer; transition:all .15s; border-right:1px solid var(--line)}\n  .seg button:last-child{border-right:none}\n  .seg button.on{background:var(--petrol); color:#fff; font-weight:600}\n  .play{font-family:'Space Mono',monospace; font-size:12.5px; color:var(--petrol); background:var(--petrol-soft);\n    border:1px solid rgba(49,90,120,.35); border-radius:9px; padding:9px 14px; cursor:pointer; transition:background .15s}\n  .play:hover{background:rgba(49,90,120,.18)}\n\n  .main{display:grid; grid-template-columns:1.35fr 1fr; gap:22px; margin-top:20px; align-items:start}\n  @media(max-width:860px){.main{grid-template-columns:1fr}}\n  .scene-box{background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow)}\n  .scene-box svg{width:100%; height:auto; display:block}\n  .sc-fade{animation:fade .4s ease}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n\n  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--tx-soft); font-family:'Space Mono',monospace}\n  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:middle}\n\n  .detail{display:flex; flex-direction:column; gap:14px}\n  .card{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:18px}\n  .kv{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}\n  .kv:last-child{margin-bottom:0}\n  .kv .k{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-softer); flex:0 0 128px}\n  .kv .v{font-weight:600; font-size:14px}\n  .kv .v.own{color:var(--petrol)}\n  .kv .v.back{color:var(--risk)}\n  .dyn{font-size:14px; color:#333; line-height:1.5}\n  .thn{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; color:var(--tx-soft)}\n  .thn b{color:var(--petrol)}\n\n  footer{padding:40px 0 20px}\n  .kick{font-family:'Newsreader',serif; font-size:1.25rem; color:#1a1a1a; font-weight:500; max-width:60ch}\n  .kick .accent{color:var(--petrol); font-style:italic}\n\n  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1; transform:none}\n  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.sc-fade{animation:none}}\n  :focus-visible{outline:2px solid var(--petrol); outline-offset:2px}\n</style>\n</head>\n<body>\n\n<section class=\"stage reveal\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">The Agentic Organization</div>\n    <h2>Agentic Commerce bedroht <span class=\"accent\">alle</span></h2>\n    <p class=\"stage-sub\">Agentic Commerce bedroht nicht einzelne Shops — es bedroht die gesamte Wertschöpfung, bis hinauf zu Amazon.</p>\n\n    <div class=\"toggles\">\n      <div class=\"seg\" id=\"seg\">\n        <button data-w=\"0\" class=\"on\">1 · Direkter Handel</button>\n        <button data-w=\"1\">2 · Plattform-Welt</button>\n        <button data-w=\"2\">3 · Agentic-Welt</button>\n      </div>\n      <button class=\"play\" id=\"play\">▶ abspielen</button>\n    </div>\n\n    <div class=\"main\">\n      <div class=\"scene-box\">\n        <svg id=\"scene\" viewBox=\"0 0 340 214\" aria-label=\"Diagramm: Wanderung der Kundenbeziehung\"></svg>\n        <div class=\"legend\">\n          <span><i style=\"background:#315a78\"></i>besitzt Kundenbeziehung</span>\n          <span><i style=\"background:#ece4d5;border:1px dashed rgba(0,0,0,.35)\"></i>Erfüllung / Backend</span>\n          <span><i style=\"background:#f6e3d8;border:1px dashed #d1653a\"></i>unter Druck</span>\n        </div>\n      </div>\n\n      <div class=\"detail\">\n        <div class=\"card\">\n          <div class=\"kv\"><span class=\"k\">Beziehung bei</span><span class=\"v own\" id=\"dOwner\"></span></div>\n          <div class=\"kv\"><span class=\"k\">Backend / abhängig</span><span class=\"v back\" id=\"dBack\"></span></div>\n        </div>\n        <div class=\"card\">\n          <div class=\"dyn\" id=\"dDyn\"></div>\n          <div class=\"thn\" id=\"dThn\"></div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<script>\n(function(){\n  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const PET=\"#315a78\", PETL=\"rgba(49,90,120,.18)\", GREY=\"#ece4d5\", GREYTX=\"#6a6357\",\n        GREYST=\"rgba(0,0,0,.30)\", LINE=\"rgba(0,0,0,.22)\", RISK=\"#d1653a\", RISKF=\"#f6e3d8\", RISKTX=\"#8a5236\",\n        CUSTF=\"#fbf7ee\", TX=\"#1a1a1a\";\n\n  const WORLDS=[\n    { owner:\"Den Shops\", back:\"—\",\n      dyn:\"Horizontaler Wettbewerb: Shop gegen Shop. Jeder Händler besitzt seine eigene Kundenbeziehung; Sichtbarkeit und Sortiment entscheiden.\",\n      thn:\"Thomann ist einer von vielen — mit direktem Draht zum Kunden.\" },\n    { owner:\"Amazon (Plattform)\", back:\"Abhängige Händler\",\n      dyn:\"Die Plattform besitzt die Kundenschnittstelle und die Daten. Wer auf ihr verkauft, gewinnt Reichweite und verliert die Beziehung — aus Händlern werden austauschbare Lieferanten, im Worst Case reine Erfüllungsgehilfen.\",\n      thn:\"Direkter Handel bleibt möglich, steht aber unter dauerndem Reichweiten-Druck.\" },\n    { owner:\"Dem KI-Agenten\", back:\"Alle — inkl. Amazon & Zalando\",\n      dyn:\"Der Agent wählt, vergleicht und kauft für den Kunden. Wer die Beziehung zum Agenten nicht besitzt, wird zum austauschbaren Backend — selbst die Plattformen verlieren die direkte Kundenbeziehung. Die Beziehung wandert eine Ebene höher.\",\n      thn:\"Chance für Thomann: früh agent-lesbar und -bevorzugt werden — statt nur beliefert zu werden.\" }\n  ];\n  let cur=0, playing=false, timer=null;\n\n  function box(x,y,w,h,label,sub,mode){\n    let fill=GREY, tx=GREYTX, stroke=GREYST, dash='4 3', sw=1;\n    if(mode==='owner'){ fill=PET; tx=\"#ffffff\"; stroke=PET; dash='none'; sw=1.2; }\n    else if(mode==='cust'){ fill=CUSTF; tx=PET; stroke=PET; dash='none'; sw=1.3; }\n    else if(mode==='risk'){ fill=RISKF; tx=RISKTX; stroke=RISK; dash='4 3'; sw=1.1; }\n    let s=`<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"6\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"${sw}\" stroke-dasharray=\"${dash}\"/>`;\n    const cx=x+w/2;\n    s+=`<text x=\"${cx}\" y=\"${y+(sub?h/2-1:h/2+4)}\" text-anchor=\"middle\" font-family=\"Montserrat,sans-serif\" font-weight=\"600\" font-size=\"9.5\" fill=\"${tx}\">${label}</text>`;\n    if(sub) s+=`<text x=\"${cx}\" y=\"${y+h/2+9}\" text-anchor=\"middle\" font-family=\"Montserrat,sans-serif\" font-size=\"6.6\" fill=\"${tx}\" opacity=\".85\">${sub}</text>`;\n    return s;\n  }\n  function link(x1,y1,x2,y2,strong){ return `<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${strong?PET:LINE}\" stroke-width=\"${strong?1.7:1}\" opacity=\"${strong?'.9':'.6'}\"/>`; }\n  function crown(cx,cy){ return `<text x=\"${cx}\" y=\"${cy}\" text-anchor=\"middle\" font-size=\"8\" fill=\"${PET}\">◆</text>`; }\n  function cap(t){ return `<text x=\"170\" y=\"207\" text-anchor=\"middle\" font-family=\"Montserrat,sans-serif\" font-size=\"7.6\" fill=\"${GREYTX}\">${t}</text>`; }\n\n  function scene(i){\n    const cust=box(110,12,120,26,\"Kund:innen\",\"\",'cust');\n    let h='';\n    if(i===0){\n      const xs=[16,80,144,208,272], labs=[\"Thomann\",\"Shop\",\"Shop\",\"Shop\",\"Shop\"];\n      xs.forEach(x=>{ h+=link(170,38,x+27,116); });\n      xs.forEach((x,k)=>{ h+=box(x,116,54,36,labs[k],\"eigener Kunde\",'owner'); });\n      h+=cust;\n      h+=`<text x=\"170\" y=\"70\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"6.4\" fill=\"${PET}\">direkte Beziehung zu jedem Shop</text>`;\n      h+=cap(\"Viele Shops konkurrieren direkt um die Kundenbeziehung.\");\n    } else if(i===1){\n      h+=link(170,38,170,74,true);\n      const xs=[12,74,136,198,260], labs=[\"Thomann\",\"Händler\",\"Händler\",\"Händler\",\"Shop\"];\n      xs.forEach((x,k)=>{ if(k>0) h+=link(170,110,x+28,158); });\n      h+=link(40,158,120,39,true);\n      h+=cust;\n      h+=box(120,74,100,36,\"Amazon\",\"Marktplatz\",'owner')+crown(170,70);\n      xs.forEach((x,k)=>{ h+=box(x,158,56,30,labs[k], k===0?\"direkt\":\"Erfüllung\", k===0?'owner':'backend'); });\n      h+=cap(\"Amazon macht Händler abhängig — Thomann verkauft direkt zum Kunden.\");\n    } else {\n      h+=link(170,38,170,70,true);\n      const xs=[12,74,136,198,260], labs=[\"Amazon\",\"Zalando\",\"Thomann\",\"Shop\",\"Händler\"], modes=['risk','risk','cust','backend','backend'];\n      xs.forEach(x=>{ h+=link(170,106,x+28,150); });\n      h+=`<path d=\"M 164 150 Q 305 118 226 40\" stroke=\"${PET}\" stroke-width=\"1.4\" fill=\"none\" opacity=\".85\" stroke-dasharray=\"4 3\"/>`;\n      h+=cust;\n      h+=box(118,70,104,36,\"KI-Agent\",\"wählt & kauft\",'owner')+crown(170,66);\n      xs.forEach((x,k)=>{ h+=box(x,150,56,32,labs[k], k===2?\"direkt\":\"austauschbar\", modes[k]); });\n      h+=cap(\"Selbst Amazon & Zalando werden Backend — Thomann hält den Draht: Agent + Kunde.\");\n    }\n    const svg=document.getElementById('scene');\n    svg.innerHTML=h;\n    svg.classList.remove('sc-fade'); void svg.offsetWidth; if(!reduce) svg.classList.add('sc-fade');\n  }\n\n  function render(){\n    const w=WORLDS[cur];\n    document.getElementById('dOwner').textContent=w.owner;\n    document.getElementById('dBack').textContent=w.back;\n    document.getElementById('dBack').className='v back'+(cur===0?' none':'');\n    document.getElementById('dDyn').textContent=w.dyn;\n    document.getElementById('dThn').innerHTML=w.thn;\n    document.querySelectorAll('#seg button').forEach((b,i)=>b.classList.toggle('on',i===cur));\n    scene(cur);\n  }\n  function select(i){ cur=((i%3)+3)%3; render(); }\n\n  document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{ stop(); select(+b.dataset.w); }));\n  const playBtn=document.getElementById('play');\n  function stop(){ playing=false; clearInterval(timer); playBtn.textContent='▶ abspielen'; }\n  playBtn.addEventListener('click',()=>{\n    if(playing){ stop(); return; }\n    playing=true; playBtn.textContent='⏸ stopp';\n    timer=setInterval(()=>{ if(cur>=2){ stop(); return; } select(cur+1); },2400);\n  });\n\n  select(0);\n})();\n\n(function(){\n  const els=document.querySelectorAll('.reveal');\n  if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return;}\n  const io=new IntersectionObserver(ent=>ent.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.08});\n  els.forEach(e=>io.observe(e));\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test((t.tagName||'')))return;try{parent.postMessage({deck:1,key:e.key},'*');}catch(_){}}});<\/script></body>\n</html>\n","dKW":"<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Der Wettbewerb ist global — Thomann Music</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Space+Mono:wght@400;700&display=swap\" rel=\"stylesheet\" />\n<style>\n  :root{\n    --bg:#f6f1e8; --bg2:#fcf8ee; --bg3:#efe7d4;\n    --tx:#1a1a1a; --tx-soft:#5a5a5a; --tx-softer:#8a8a8a;\n    --line:rgba(0,0,0,.12);\n    --petrol:#315a78; --petrol-d:#264a64; --petrol-soft:rgba(49,90,120,.10);\n    --dom:#33363b; --foreign:#d1653a;\n    --shadow:0 18px 44px -24px rgba(0,0,0,.20);\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--bg); color:var(--tx);\n    font-family:'Montserrat',Arial,sans-serif; font-weight:300; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1040px; margin:0 auto; padding:0 26px}\n  h1,h2,h3{font-family:'Newsreader','Source Serif Pro',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.15; color:#1a1a1a}\n  .mono{font-family:'Space Mono',ui-monospace,monospace}\n\n  .stage{padding:46px 0}\n  .eyebrow{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--petrol); margin-bottom:10px}\n  .stage h2{font-size:clamp(1.8rem,3.9vw,3.0rem); margin:0}\n  .stage h2 .accent{color:var(--petrol); font-style:italic}\n  .stage-sub{color:#1a1a1a; max-width:64ch; margin:12px 0 0; font-size:1.05rem; line-height:1.6}\n  .thesis-line{margin:
